          const v = V.fixed('D', t.p, t.q, 0n);
          v.pic = t.pic;
          return v;
        }
      }
      return V.fixed('D', 1, 0, 0n);
    }
    valueOfCell(cell) {
      if (cell.view === 'substr') {
        const bv = this.valueOfCell(cell.base).v;
        return V.char(bv.substr(cell.pos - 1, cell.len).padEnd(cell.len));
      }
      if (cell.arr) return { k: 'A', shape: cell.bounds, vals: cell.el.map((c) => this.valueOfCell(c)) };
      if (cell.st) return { k: 'S', cell };
      if (!cell.set) {
        const d = cell.d;
        const key = 'u' + (d ? d.id : '?');
        if (!this.warnKeys.has(key)) {
          this.warn(
            `${d ? this.qname(d) : 'Variable'} wird gelesen, bevor ihr ein Wert zugewiesen wurde. In echtem PL/I steht dann ein zufälliger Speicherinhalt drin (AUTOMATIC-Variablen ohne INIT sind NICHT 0). Tipp: INIT(...) verwenden.`,
            this.line,
            key
          );
        }
        return this.defaultValue(cell.t);
      }
      return cell.v;
    }
    assignTo(loc, val, node) {
      if (loc.view === 'substr') {
        const s = this.toCharStr(val).padEnd(loc.len).slice(0, loc.len);
        const b = loc.base;
        const cur = b.set ? b.v.v : ' '.repeat(b.t.len);
        b.v = V.char(cur.slice(0, loc.pos - 1) + s + cur.slice(loc.pos - 1 + loc.len));
        b.set = true;
        return;
      }
      if (loc.arr) {
        if (val.k === 'A') {
          if (val.vals.length !== loc.el.length)
            this.abort(`Array-Zuweisung mit unterschiedlicher Größe (${loc.el.length} ← ${val.vals.length} Elemente).`);
          for (let i = 0; i < loc.el.length; i++) this.assignTo(loc.el[i], val.vals[i]);
        } else for (const e of loc.el) this.assignTo(e, val);
        return;
      }
      if (loc.st) {
        if (val.k === 'S') {
          const src = val.cell;
          if (src === loc) return;
          if (src.m.length !== loc.m.length)
            this.abort(`Strukturzuweisung: ${loc.d.raw} und ${src.d.raw} haben unterschiedlich viele Elemente. Tipp: Zuweisung mit ", BY NAME".`);
          const vals = src.m.map((c) => this.valueOfCell(c));
          for (let i = 0; i < loc.m.length; i++) this.assignTo(loc.m[i], vals[i]);
        } else if (val.k === 'A') this.abort('Ein Array kann keiner Struktur zugewiesen werden.');
        else for (const m of loc.m) this.assignTo(m, val);
        return;
      }
      if (val.k === 'A') this.abort(`Einer einzelnen Variablen (${loc.d ? this.qname(loc.d) : ''}) kann kein ganzes Array zugewiesen werden.`);
      if (val.k === 'S') this.abort(`Einer einzelnen Variablen (${loc.d ? this.qname(loc.d) : ''}) kann keine Struktur zugewiesen werden.`);
      loc.v = this.convert(val, loc.t, loc);
      loc.set = true;
    }
    assignByName(dst, src) {
      if (!dst.st || !src.st) this.abort('BY NAME geht nur zwischen Strukturen.');
      dst.m.forEach((dm) => {
        const sm = src.m.find((x) => x.d.name === dm.d.name);
        if (!sm) return;
        if (dm.st && sm.st) this.assignByName(dm, sm);
        else this.assignTo(dm, this.valueOfCell(sm));
      });
    }
    leafCells(cell, out) {
      if (cell.arr) for (const e of cell.el) this.leafCells(e, out);
      else if (cell.st) for (const m of cell.m) this.leafCells(m, out);
      else out.push(cell);
      return out;
    }

    // ---------- Referenzen ----------
    ci(d) {
      if (d.ci === undefined) d.ci = d.parent.children.indexOf(d);
      return d.ci;
    }
    rootCell(root, frame, ref) {
      switch (root.storage) {
        case 'AUTO':
        case 'PARAM':
        case 'DEFINED': {
          const f = this.findFrame(root.block, frame);
          const c = f.slots[root.slot];
          if (!c) this.abort(`${root.raw} ist noch nicht angelegt.`);
          return c;
        }
        case 'STATIC':
          return this.staticCell(root);
        case 'CTL':
          if (!root.ctl.length) this.abort(`CONTROLLED-Variable ${root.raw} ist nicht alloziert – zuerst ALLOCATE ${root.raw};`);
          return root.ctl[root.ctl.length - 1];
        case 'BASED': {
          const p = ref && ref.ptr ? this.eval(ref.ptr, frame) : this.eval(root.attrs.basedPtr, frame);
          if (p.k !== 'P') this.abort(`Für ${root.raw} wird ein Zeiger (POINTER) benötigt.`);
          const target = p.v;
          if (!target)
            this.abort(`Zugriff auf ${root.raw} über einen NULL-Zeiger. (Im echten Programm: Abbruch mit S0C4 – Schutzverletzung.)`);
          if (target.freed) this.abort(`Zugriff auf ${root.raw} über einen Zeiger auf bereits freigegebenen Speicher (nach FREE).`);
          if (target.decl !== root) {
            const key = target.decl.id + ':' + root.id;
            let ok = this.sigCache.get(key);
            if (ok === undefined) {
              const probe = this.makeCell(root, frame);
              ok = this.sigOf(probe) === this.sigOf(target.cell);
              this.sigCache.set(key, ok);
            }
            if (!ok)
              this.abort(
                `Der Zeiger zeigt auf ${target.decl.raw}, dessen Aufbau nicht zu ${root.raw} passt. Überlagerungen unterschiedlicher Typen werden in der Lernumgebung nicht unterstützt.`
              );
          }
          return target.cell;
        }
      }
      this.abort('Interner Fehler: unbekannte Speicherklasse ' + root.storage);
    }
    sigOf(c) {
      if (c.arr) return `A${c.el.length}(${this.sigOf(c.el[0])})`;
      if (c.st) return `S(${c.m.map((m) => this.sigOf(m)).join(',')})`;
      if (c.view) return 'C' + c.len;
      return PLI.typeName(c.t);
    }
    locate(ref, frame) {
      const res = ref.res;
      if (!res || res.kind !== 'var') this.abort(`${ref.parts[0].raw} ist keine Variable.`);
      let cell = this.rootCell(res.root, frame, ref);
      let subs = null;
      if (ref.subTotal > 0) {
        for (const p of ref.parts) {
          if (p.args) {
            if (!subs) subs = [];
            for (const a of p.args) subs.push(a.type === 'star' ? STAR : this.toInt(this.eval(a, frame)));
          }
        }
      }
      return this.walkAt(cell, res.path, 0, subs, 0, ref);
    }
    walkAt(cell, path, i, subs, si, ref) {
      const last = path.length - 1;
      for (;;) {
        if (cell.arr && !cell.isParamView) {
          const nd = cell.bounds.length;
          if (subs && si < subs.length) {
            const ix = subs.slice(si, si + nd);
            si += nd;
            if (ix.includes(STAR)) {
              const view = this.crossSection(cell, ix, path[i]);
              if (i === last) return view;
              return this.viewMap(view, (e) => this.walkAt(e.m[this.ci(path[i + 1])], path, i + 1, subs, si, ref));
            }
            cell = this.element(cell, ix, path[i]);
          } else {
            if (i === last) return cell;
            return this.viewMap(cell, (e) => this.walkAt(e.m[this.ci(path[i + 1])], path, i + 1, subs, si, ref));
          }
        }
        if (i === last) return cell;
        cell = cell.m[this.ci(path[i + 1])];
        i++;
      }
    }
    viewMap(arr, fn) {
      const el = arr.el.map(fn);
      if (el.length && el[0].arr) {
        const bounds = arr.bounds.concat(el[0].bounds);
        return { arr: true, view: 'agg', d: arr.d, bounds, el: [].concat(...el.map((x) => x.el)) };
      }
      return { arr: true, view: 'agg', d: arr.d, bounds: arr.bounds, el };
    }
    crossSection(cell, ix, d) {
      const bounds = cell.bounds;
      const out = [];
      const nb = [];
      ix.forEach((k, j) => {
        if (k === STAR) nb.push(bounds[j]);
        else if (k < bounds[j][0] || k > bounds[j][1]) this.subscriptError(d, k, bounds[j]);
      });
      const rec = (j, off) => {
        if (j === bounds.length) {
          out.push(cell.el[off]);
          return;
        }
        const [lo, hi] = bounds[j];
        const ext = hi - lo + 1;
        if (ix[j] === STAR) for (let k = lo; k <= hi; k++) rec(j + 1, off * ext + (k - lo));
        else rec(j + 1, off * ext + (ix[j] - lo));
      };
      rec(0, 0);
      return { arr: true, view: 'agg', d: cell.d, bounds: nb, el: out };
    }
    element(cell, ix, d) {
      let off = 0;
      const b = cell.bounds;
      for (let j = 0; j < b.length; j++) {
        const k = ix[j];
        const [lo, hi] = b[j];
        if (k < lo || k > hi) {
          this.subscriptError(d, k, b[j]);
          return this.dummyCell(cell.el[0]);
        }
        off = off * (hi - lo + 1) + (k - lo);
      }
      return cell.el[off];
    }
    dummyCell(proto) {
      return { d: proto.d, t: proto.t || { k: 'F', b: 'D', p: 5, q: 0 }, v: null, set: false };
    }
    subscriptError(d, k, [lo, hi]) {
      const name = this.qname(d);
      if (this.enabled('SUBSCRIPTRANGE')) {
        this.raise('SUBSCRIPTRANGE', { msg: `Index ${k} außerhalb der Grenzen ${lo}:${hi} von ${name}.` });
        this.raiseError(`Rückkehr aus der SUBSCRIPTRANGE-Einheit ist nicht möglich (Index ${k} von ${name}).`);
      }
      this.abort(
        `Index ${k} liegt außerhalb der Grenzen ${lo}:${hi} von ${name}. Achtung: SUBSCRIPTRANGE ist standardmäßig AUSGESCHALTET – ein echtes Programm würde jetzt unbemerkt fremden Speicher lesen oder überschreiben! Tipp: (SUBSCRIPTRANGE): vor die PROCEDURE-Anweisung schreiben.`
      );
    }

    // ---------- Bedingungen ----------
    enabled(name) {
      const bit = PLI.COND[name];
      if (bit === undefined) return true;
      return (this.en & bit) !== 0;
    }
    condKey(name, fileName, cname) {
      if (fileName) return name + ':' + fileName;
      if (cname) return name + ':' + cname;
      return name;
    }
    findHandler(key) {
      for (let f = this.frame; f; f = f.caller) {
        if (f.on && f.on.has(key)) {
          const h = f.on.get(key);
          if (!h.active) return h;
        }
      }
      return null;
    }
    raise(name, info) {
      info = info || {};
      info.name = name;
      if (info.oncode == null) info.oncode = PLI.ONCODES[name] || 0;
      info.line = this.line;
      const key = this.condKey(name, info.fileName, info.cname);
      const h = this.findHandler(key);
      if (h && !h.system) {
        this.condStack.push(info);
        try {
          this.runHandler(h, info);
        } finally {
          this.condStack.pop();
        }
        if (name === 'ERROR') {
          this.errorStop = { line: info.line, msg: (info.msg || 'ERROR-Bedingung') + ' (Die ERROR-ON-Einheit kehrte normal zurück – das Programm wird beendet.)' };
          this.raiseFinish();
          throw new StopSig('error');
        }
        return 'normal';
      }
      if (h && h.system && h.snap) this.snap(info);
      return this.systemAction(name, info);
    }
    raiseError(msg) {
      this.raise('ERROR', { msg });
      throw new StopSig('error');
    }
    condText(name, info) {
      switch (name) {
        case 'ZERODIVIDE':
          return 'Division durch Null (ZERODIVIDE-Bedingung).';
        case 'FIXEDOVERFLOW':
          return `Festkomma-Überlauf (FIXEDOVERFLOW): Das Ergebnis hat mehr Stellen, als PL/I in Zwischenergebnissen erlaubt.${info.msg ? ' ' + info.msg : ''}`;
        case 'OVERFLOW':
          return 'Gleitkomma-Überlauf (OVERFLOW).';
        case 'SIZE':
          return `SIZE-Bedingung: ${info.msg || 'Wert passt nicht in die Zielvariable.'}`;
        case 'CONVERSION':
          return `Umwandlungsfehler (CONVERSION): '${info.onsource}' ist keine gültige Zahl${info.onchar ? ' (ungültiges Zeichen "' + info.onchar + '")' : ''}.`;
        case 'ENDFILE':
          return `Dateiende (ENDFILE) bei Datei ${info.fileName}, aber keine ON ENDFILE(${info.fileName})-Einheit vorhanden.`;
        case 'UNDEFINEDFILE':
          return `Datei ${info.fileName} kann nicht geöffnet werden (UNDEFINEDFILE): ${info.msg || 'Datei nicht vorhanden.'}`;
        case 'SUBSCRIPTRANGE':
          return `SUBSCRIPTRANGE: ${info.msg}`;
        case 'STRINGRANGE':
          return `STRINGRANGE: ${info.msg}`;
        case 'KEY':
          return `KEY-Bedingung bei Datei ${info.fileName}.`;
        case 'RECORD':
          return `RECORD-Bedingung bei Datei ${info.fileName}: ${info.msg || ''}`;
        case 'STORAGE':
          return 'Kein Speicher mehr (STORAGE).';
        case 'CONDITION':
          return `Bedingung CONDITION(${info.cname}) ausgelöst.`;
        default:
          return `Bedingung ${name} ausgelöst.`;
      }
    }
    systemAction(name, info) {
      switch (name) {
        case 'CONDITION':
          this.display.push(`IBM-Hinweis: CONDITION(${info.cname}) wurde ausgelöst (Zeile ${info.line}), keine ON-Einheit – Programm läuft weiter.`);
          return 'normal';
        case 'FINISH':
        case 'ENDPAGE':
        case 'UNDERFLOW':
        case 'STRINGSIZE':
          return 'normal';
        case 'STRINGRANGE':
          this.warn(info.msg + ' (STRINGRANGE: Die Lernumgebung kürzt die Angabe auf den gültigen Bereich.)', info.line);
          return 'normal';
        case 'ERROR': {
          const msg = info.msg || 'ERROR-Bedingung ausgelöst.';
          this.errorStop = {
            line: info.line,
            msg: `${msg}${info.oncode && info.oncode !== 9 ? ' [ONCODE=' + info.oncode + ']' : ''}`,
          };
          this.raiseFinish();
          throw new StopSig('error');
        }
        default: {
          const txt = this.condText(name, info);
          this.raise('ERROR', { msg: txt, oncode: info.oncode, origin: name, onsource: info.onsource, onchar: info.onchar, fileName: undefined });
          throw new StopSig('error');
        }
      }
    }
    runHandler(h, info) {
      h.active = true;
      const saveFrame = this.frame, saveLine = this.line, saveEn = this.en;
      try {
        if (h.snap) this.snap(info);
        if (h.unit.type === 'begin') {
          this.execBegin(h.unit, h.frame, this.frame);
        } else {
          const pf = new Frame(ONUNIT_BLOCK, h.frame, this.frame);
          this.exec(h.unit, pf);
        }
      } finally {
        h.active = false;
        this.frame = saveFrame;
        this.line = saveLine;
        this.en = saveEn;
      }
    }
    snap(info) {
      const chain = [];
      for (let f = this.frame; f; f = f.caller) if (f.block && f.block.kind === 'proc') chain.push(f.block.name);
      this.display.push(`SNAP: Bedingung ${info.name} in Zeile ${info.line}. Aufrufkette: ${chain.join(' ← ')}`);
    }

    // ---------- Umwandlungen ----------
    isArith(v) {
      return v.k === 'F' || v.k === 'E';
    }
    convError(str) {
      if (!this.enabled('CONVERSION')) {
        this.warn(`'${str}' ist keine gültige Zahl (CONVERSION ist ausgeschaltet – Ergebnis 0).`, this.line);
        return V.fixed('D', 1, 0, 0n);
      }
      const bad = [...str].find((c) => !/[0-9 .+\-Ee]/.test(c)) || str.trim()[0] || ' ';
      const info = { onsource: str, onchar: bad };
      this.raise('CONVERSION', info);
      if (info.changed) {
        const n = PLI.parseNumber(info.onsource);
        if (n) return n;
      }
      this.raiseError(
        `Rückkehr aus der CONVERSION-Einheit, ohne ONSOURCE zu korrigieren ('${str}'). Tipp: In der ON-Einheit ONSOURCE = '0'; setzen oder mit GOTO weiterspringen.`
      );
    }
    toArith(val) {
      switch (val.k) {
        case 'F':
        case 'E':
          return val;
        case 'C': {
          const n = PLI.parseNumber(val.v);
          if (!n) return this.convError(val.v);
          return n;
        }
        case 'B': {
          const s = val.v;
          if (!s.length) return V.fixed('B', 1, 0, 0n);
          return V.fixed('B', Math.min(Math.max(s.length, 1), 63), 0, BigInt('0b' + s));
        }
        case 'P':
          this.abort('Ein Zeiger kann nicht in eine Zahl umgewandelt werden.');
          break;
        case 'A':
        case 'S':
          this.abort('Hier wird ein einzelner Wert erwartet, kein Array/keine Struktur.');
      }
      this.abort('Wert kann nicht in eine Zahl umgewandelt werden.');
    }
    toNum(val) {
      const a = this.toArith(val);
      if (a.k === 'E') return a.v;
      return Number(a.v) / Math.pow(10, a.q);
    }
    toInt(val) {
      const a = this.toArith(val);
      if (a.k === 'E') return Math.trunc(a.v);
      return Number(rescale(a.v, a.q, 0));
    }
    toCharStr(val) {
      switch (val.k) {
        case 'C':
          return val.v;
        case 'B':
          return val.v;
        case 'F':
          if (val.pic) return PLI.formatPicture(val.pic, val.v) || '*'.repeat(val.pic.len);
          return PLI.fixedToChar(val);
        case 'E':
          return PLI.floatToChar(val.v, val.p);
        case 'P':
          this.abort('Ein Zeiger kann nicht in eine Zeichenkette umgewandelt werden.');
          break;
        case 'A':
        case 'S':
          this.abort('Hier wird ein einzelner Wert erwartet, kein Array/keine Struktur.');
      }
      return '';
    }
    toBitStr(val) {
      switch (val.k) {
        case 'B':
          return val.v;
        case 'C':
          if (/^[01]*$/.test(val.v)) return val.v;
          if (!this.enabled('CONVERSION')) return '0';
          {
            const info = { onsource: val.v, onchar: [...val.v].find((c) => c !== '0' && c !== '1') };
            this.raise('CONVERSION', info);
            this.raiseError(`'${val.v}' kann nicht in einen Bitstring umgewandelt werden.`);
          }
          break;
        case 'F':
        case 'E': {
          let iv, len;
          if (val.k === 'F') {
            iv = babs(rescale(val.v, val.q, 0));
            len = val.b === 'B' ? val.p : Math.ceil((val.p - val.q) * 3.32);
          } else {
            iv = BigInt(Math.trunc(Math.abs(val.v)));
            len = Math.ceil(val.p * 3.32);
          }
          if (len < 1) len = 1;
          let bits = iv.toString(2);
          if (bits.length > len) bits = bits.slice(bits.length - len);
          return bits.padStart(len, '0');
        }
        case 'P':
          this.abort('Ein Zeiger kann nicht in einen Bitstring umgewandelt werden.');
      }
      this.abort('Wert kann nicht in einen Bitstring umgewandelt werden.');
    }
    truth(val) {
      if (val.k === 'A' || val.k === 'S') this.abort('Eine Bedingung muss ein einzelner Wert sein, kein Array.');
      return this.toBitStr(val).includes('1');
    }
    sizeCheck(b, p, q, v, t) {
      const limit = b === 'D' ? pow10(p) : pow2(p);
      if (babs(v) >= limit) {
        const shown = PLI.scaledToStr(v, q);
        const tn = t ? PLI.typeName(t) : `FIXED ${b === 'D' ? 'DEC' : 'BIN'}(${p}${q ? ',' + q : ''})`;
        if (this.enabled('SIZE')) {
          this.raise('SIZE', { msg: `Der Wert ${shown} passt nicht in ${tn}.` });
          return V.fixed(b, p, q, 0n);
        }
        this.warn(
          `Der Wert ${shown} passt nicht in ${tn} – die höherwertigen Stellen gehen verloren. (Die SIZE-Bedingung ist standardmäßig ausgeschaltet. Mit (SIZE): vor der Anweisung oder PROCEDURE würde PL/I den Fehler melden.)`,
          this.line
        );
        if (b === 'D') v = v % limit;
        else {
          const m = pow2(p + 1);
          let w = ((v % m) + m) % m;
          if (w >= pow2(p)) w -= m;
          v = w;
        }
      }
      return V.fixed(b, p, q, v);
    }
    convert(val, t, loc) {
      switch (t.k) {
        case 'F': {
          const a = this.toArith(val);
          let v;
          if (a.k === 'E') {
            if (!isFinite(a.v)) this.raiseError('Unendlicher Gleitkommawert kann nicht in FIXED umgewandelt werden.');
            v = PLI.numberToScaled(a.v, t.q, false);
          } else v = rescale(a.v, a.q, t.q);
          return this.sizeCheck(t.b, t.p, t.q, v, t);
        }
        case 'PIC': {
          const a = this.toArith(val);
          const v = a.k === 'E' ? PLI.numberToScaled(a.v, t.q, false) : rescale(a.v, a.q, t.q);
          const r = this.sizeCheck('D', t.p, t.q, v, t);
          r.pic = t.pic;
          return r;
        }
        case 'E': {
          const x = this.toNum(val);
          if (!isFinite(x)) {
            this.raise('OVERFLOW', {});
          }
          return V.float(t.p, x, t.b);
        }
        case 'C': {
          let s = this.toCharStr(val);
          const L = t.len;
          if (t.vy) {
            if (s.length > L) s = s.slice(0, L);
            return V.char(s, true);
          }
          s = s.length >= L ? s.slice(0, L) : s.padEnd(L);
          return V.char(s, false);
        }
        case 'B': {
          let s = this.toBitStr(val);
          const L = t.len;
          if (t.vy) {
            if (s.length > L) s = s.slice(0, L);
            return V.bit(s);
          }
          s = s.length >= L ? s.slice(0, L) : s.padEnd(L, '0');
          return V.bit(s);
        }
        case 'P':
          if (val.k !== 'P') this.abort('Einer POINTER-Variablen kann nur ein Zeiger zugewiesen werden (z.B. ADDR(X) oder NULL()).');
          return val;
      }
      this.abort('Interner Fehler: unbekannter Zieltyp.');
    }
    sameType(a, b) {
      if (!a || !b || a.k !== b.k) return false;
      switch (a.k) {
        case 'F':
          return a.b === b.b && a.p === b.p && a.q === b.q;
        case 'E':
          return a.b === b.b && a.p === b.p;
        case 'C':
        case 'B':
          return a.len === b.len && !!a.vy === !!b.vy;
        case 'P':
          return true;
        case 'PIC':
          return a.pic.ex === b.pic.ex;
      }
      return false;
    }

    // ---------- Arithmetik ----------
    checkFixed(b, p, q, v) {
      const limit = b === 'D' ? pow10(p) : pow2(p);
      if (babs(v) >= limit) {
        if (this.enabled('FIXEDOVERFLOW')) {
          this.raise('FIXEDOVERFLOW', {
            msg: `(Ergebnis ${PLI.scaledToStr(v, q)}, erlaubt sind ${p} Stellen davon ${q} Nachkommastellen.)`,
          });
          return V.fixed(b, p, q, 0n);
        }
        this.warn('Festkomma-Überlauf (FIXEDOVERFLOW ausgeschaltet) – Ergebnis abgeschnitten.', this.line);
        v = v % limit;
      }
      return V.fixed(b, p, q, v);
    }
    zeroDiv() {
      if (this.enabled('ZERODIVIDE')) {
        this.raise('ZERODIVIDE', {});
      } else this.warn('Division durch Null (ZERODIVIDE ausgeschaltet) – Ergebnis 0.', this.line);
      return V.fixed('D', 1, 0, 0n);
    }
    decOp(op, a, b) {
      const N = this.ND;
      switch (op) {
        case '+':
        case '-': {
          const q = Math.max(a.q, b.q);
          const p = Math.min(N, Math.max(a.p - a.q, b.p - b.q) + q + 1);
          const x = rescale(a.v, a.q, q), y = rescale(b.v, b.q, q);
          return this.checkFixed('D', p, q, op === '+' ? x + y : x - y);
        }
        case '*': {
          const p = Math.min(N, a.p + b.p + 1);
          const q = a.q + b.q;
          return this.checkFixed('D', Math.max(p, q), q, a.v * b.v);
        }
        case '/': {
          if (b.v === 0n) return this.zeroDiv();
          const p = N;
          let q = N - a.p + a.q - b.q;
          if (q < 0) q = 0;
          if (q > N) q = N;
          const e = q + b.q - a.q;
          const num = e >= 0 ? a.v * pow10(e) : a.v / pow10(-e);
          return this.checkFixed('D', p, q, num / b.v);
        }
      }
    }
    binOp(op, a, b) {
      const N = this.NB;
      switch (op) {
        case '+':
        case '-': {
          const p = Math.min(N, Math.max(a.p, b.p) + 1);
          return this.checkFixed('B', p, 0, op === '+' ? a.v + b.v : a.v - b.v);
        }
        case '*': {
          const p = Math.min(N, a.p + b.p + 1);
          return this.checkFixed('B', p, 0, a.v * b.v);
        }
        case '/': {
          if (b.v === 0n) return this.zeroDiv();
          const qbits = N - a.p;
          if (qbits <= 0) return this.checkFixed('B', N, 0, a.v / b.v);
          const s = Math.min(this.ND - 1, Math.floor(qbits * 0.30103));
          return this.checkFixed('D', this.ND, s, (a.v * pow10(s)) / b.v);
        }
      }
    }
    toBinPrec(a) {
      return V.fixed('B', Math.min(Math.ceil(a.p * 3.32) + 1, this.NB), 0, a.v);
    }
    toDecPrec(a) {
      return V.fixed('D', Math.min(PLI.binToDecPrec(a.p), this.ND), 0, a.v);
    }
    floatOp(op, x, y, p) {
      let r;
      switch (op) {
        case '+':
          r = x + y;
          break;
        case '-':
          r = x - y;
          break;
        case '*':
          r = x * y;
          break;
        case '/':
          if (y === 0) {
            this.zeroDiv();
            return V.float(p, 0);
          }
          r = x / y;
          break;
        case '**':
          if (x === 0 && y <= 0) {
            this.raiseError('0 hoch eine Zahl ≤ 0 ist nicht definiert.');
          }
          if (x < 0 && !Number.isInteger(y)) this.raiseError('Negative Zahl hoch einen nicht ganzzahligen Exponenten ist nicht definiert.');
          r = Math.pow(x, y);
          break;
      }
      if (!isFinite(r)) {
        this.raise('OVERFLOW', {});
        r = 0;
      }
      return V.float(p, r);
    }
    arith(op, a, b) {
      a = this.toArith(a);
      b = this.toArith(b);
      if (a.k === 'E' || b.k === 'E') {
        const p = Math.max(a.k === 'E' ? a.p : a.b === 'D' ? a.p : Math.ceil(a.p / 3.32), b.k === 'E' ? b.p : b.b === 'D' ? b.p : Math.ceil(b.p / 3.32));
        return this.floatOp(op, this.toNum(a), this.toNum(b), Math.max(1, Math.min(p, 16)));
      }
      if (op === '**') return this.powFixed(a, b);
      if (a.b !== b.b) {
        if (a.q === 0 && b.q === 0) {
          if (a.b === 'D') a = this.toBinPrec(a);
          else b = this.toBinPrec(b);
        } else {
          if (a.b === 'B') a = this.toDecPrec(a);
          else b = this.toDecPrec(b);
        }
      }
      if (a.b === 'B') return this.binOp(op, a, b);
      return this.decOp(op, a, b);
    }
    powFixed(a, b) {
      if (b.q === 0 && b.v >= 0n && b.v <= 64n) {
        const n = Number(b.v);
        const N = a.b === 'D' ? this.ND : this.NB;
        const pr = (a.p + 1) * n - 1;
        if (n === 0) return V.fixed(a.b, 1, 0, 1n);
        if (pr <= N) return this.checkFixed(a.b, Math.max(pr, 1), a.q * n, a.v ** b.v);
      }
      return this.floatOp('**', this.toNum(a), this.toNum(b), 15);
    }
    compareArith(x, y) {
      if (x.k === 'E' || y.k === 'E') {
        const a = this.toNum(x), b = this.toNum(y);
        return a < b ? -1 : a > b ? 1 : 0;
      }
      const q = Math.max(x.q, y.q);
      const a = rescale(x.v, x.q, q), b = rescale(y.v, y.q, q);
      return a < b ? -1 : a > b ? 1 : 0;
    }
    compare(a, b) {
      if (a.k === 'P' || b.k === 'P') {
        if (a.k !== 'P' || b.k !== 'P') this.abort('Ein Zeiger kann nur mit einem anderen Zeiger verglichen werden.');
        return a.v === b.v ? 0 : 1;
      }
      if (a.k === 'A' || a.k === 'S' || b.k === 'A' || b.k === 'S') this.abort('Arrays/Strukturen können nicht direkt verglichen werden.');
      if (this.isArith(a) || this.isArith(b)) return this.compareArith(this.toArith(a), this.toArith(b));
      if (a.k === 'B' && b.k === 'B') {
        const n = Math.max(a.v.length, b.v.length);
        const x = a.v.padEnd(n, '0'), y = b.v.padEnd(n, '0');
        return x < y ? -1 : x > y ? 1 : 0;
      }
      return PLI.compareChars(this.toCharStr(a), this.toCharStr(b));
    }
    binop(op, a, b, node) {
      if (a.k === 'A' || b.k === 'A') {
        if (a.k === 'A' && b.k === 'A' && a.vals.length !== b.vals.length)
          this.abort('Arrays unterschiedlicher Größe können nicht verknüpft werden.');
        const n = a.k === 'A' ? a.vals.length : b.vals.length;
        const vals = new Array(n);
        for (let i = 0; i < n; i++) vals[i] = this.binop(op, a.k === 'A' ? a.vals[i] : a, b.k === 'A' ? b.vals[i] : b, node);
        return { k: 'A', shape: (a.k === 'A' ? a : b).shape, vals };
      }
      if (a.k === 'S' || b.k === 'S') this.abort('Mit ganzen Strukturen kann nicht gerechnet werden – verwende die einzelnen Elemente.');
      switch (op) {
        case '+':
        case '-':
        case '*':
        case '/':
        case '**':
          return this.arith(op, a, b);
        case '||':
          if (a.k === 'B' && b.k === 'B') return V.bit(a.v + b.v);
          return V.char(this.toCharStr(a) + this.toCharStr(b));
        case '&':
        case '|': {
          const x = this.toBitStr(a), y = this.toBitStr(b);
          const n = Math.max(x.length, y.length);
          const xs = x.padEnd(n, '0'), ys = y.padEnd(n, '0');
          let r = '';
          for (let i = 0; i < n; i++)
            r += op === '&' ? (xs[i] === '1' && ys[i] === '1' ? '1' : '0') : xs[i] === '1' || ys[i] === '1' ? '1' : '0';
          return V.bit(r);
        }
        default: {
          const c = this.compare(a, b);
          let r;
          switch (op) {
            case '=':
              r = c === 0;
              break;
            case 'NE':
              r = c !== 0;
              break;
            case '<':
              r = c < 0;
              break;
            case '>':
              r = c > 0;
              break;
            case '<=':
              r = c <= 0;
              break;
            case '>=':
              r = c >= 0;
              break;
          }
          if ((a.k === 'P' || b.k === 'P') && op !== '=' && op !== 'NE') this.abort('Zeiger kann man nur mit = und ¬= vergleichen.');
          return r ? PLI.TRUE : PLI.FALSE;
        }
      }
    }
    unop(op, v) {
      if (v.k === 'A') return { k: 'A', shape: v.shape, vals: v.vals.map((x) => this.unop(op, x)) };
      if (op === '¬') {
        const s = this.toBitStr(v);
        return V.bit([...s].map((c) => (c === '1' ? '0' : '1')).join(''));
      }
      const a = this.toArith(v);
      if (op === '+') return a;
      if (a.k === 'E') return V.float(a.p, -a.v, a.b);
      return V.fixed(a.b, a.p, a.q, -a.v);
    }
    sign(v) {
      const a = this.toArith(v);
      if (a.k === 'E') return Math.sign(a.v);
      return a.v < 0n ? -1 : a.v > 0n ? 1 : 0;
    }

    // ---------- Ausdrücke ----------
    eval(e, frame) {
      switch (e.type) {
        case 'num':
        case 'str':
        case 'bitc':
          return e.val;
        case 'paren':
          return this.eval(e.e, frame);
        case 'un':
          return this.unop(e.op, this.eval(e.e, frame));
        case 'bin': {
          const a = this.eval(e.l, frame);
          const b = this.eval(e.r, frame);
          return this.binop(e.op, a, b, e);
        }
        case 'ref':
          return this.evalRef(e, frame);
        case 'star':
          this.abort('"*" ist hier nicht erlaubt.');
      }
      this.abort('Interner Fehler: unbekannter Ausdruck ' + e.type);
    }
    evalRef(e, frame) {
      const res = e.res;
      switch (res.kind) {
        case 'var':
          return this.valueOfCell(this.locate(e, frame));
        case 'builtin':
          return this.callBuiltin(e, frame);
        case 'proc':
          return this.callProc(res.block, e.parts[0].args || [], frame, e, true);
        case 'entryExt':
          this.abort(`Die externe Prozedur ${e.parts[0].raw} ist nicht vorhanden – in der Lernumgebung müssen alle Prozeduren im selben Quelltext stehen.`);
      }
      this.abort(`${e.parts[0].raw} kann hier nicht verwendet werden.`);
    }
    callBuiltin(e, frame) {
      const def = e.res.def;
      const args = e.parts[0].args || [];
      return def.fn(this, args, frame, e);
    }
    argv(node, frame) {
      return this.eval(node, frame);
    }

    // ---------- Prozeduren ----------
    callProc(pb, argNodes, frame, node, isFunc) {
      const proc = pb.node;
      if (pb.active > 0 && !proc.recursive)
        this.raiseError(`Prozedur ${pb.name} wird rekursiv aufgerufen, ist aber nicht als RECURSIVE deklariert. Schreibe: ${pb.name}: PROC(...) RECURSIVE;`);
      if (this.depth > 1500) this.abort('Zu tiefe Rekursion (Stapel voll, STORAGE). Fehlt eine Abbruchbedingung?');
      const stat = this.findFrame(pb.parent, frame);
      const nf = new Frame(pb, stat, frame);
      if (argNodes.length !== pb.params.length)
        this.abort(`${pb.name} erwartet ${pb.params.length} Argument(e), übergeben wurden ${argNodes.length}.`);
      for (let i = 0; i < argNodes.length; i++) nf.slots[pb.params[i].slot] = this.bindArg(argNodes[i], pb.params[i], frame, nf, pb);
      pb.active++;
      this.depth++;
      const saveLine = this.line, saveEn = this.en;
      let ret;
      this.frame = nf;
      try {
        this.enterBlock(nf);
        this.execList(proc.body, nf);
        if (isFunc) {
          this.line = proc.endLine || this.line;
          this.raiseError(`Funktion ${pb.name} wurde ohne RETURN(...) beendet.`);
        }
      } catch (e) {
        if (e instanceof ReturnSig) ret = e.value;
        else throw e;
      } finally {
        pb.active--;
        this.depth--;
        this.frame = frame;
      }
      this.line = saveLine;
      this.en = saveEn;
      if (isFunc) {
        if (ret === undefined) this.raiseError(`Funktion ${pb.name}: RETURN ohne Wert.`);
        const rt = this.evalType(pb.retType, nf);
        return this.convert(ret, rt);
      }
      return undefined;
    }
    paramType(pdecl, argT, argVal, nf) {
      const t = pdecl.type;
      if ((t.k === 'C' || t.k === 'B') && t.lenExpr && t.lenExpr.star) {
        let len;
        if (argT && (argT.k === t.k)) len = argT.len;
        else len = argVal ? (t.k === 'C' ? this.toCharStr(argVal) : this.toBitStr(argVal)).length : 0;
        return { k: t.k, len, vy: !!t.vy };
      }
      return this.evalType(t, nf, pdecl);
    }
    bindArg(argNode, pdecl, callerFrame, nf, pb) {
      const isAgg = (pdecl.dims && pdecl.dims.length) || pdecl.children.length;
      if (argNode.type === 'ref' && argNode.res && argNode.res.kind === 'var') {
        const loc = this.locate(argNode, callerFrame);
        if (isAgg) {
          if (!(loc.arr || loc.st)) this.abort(`Parameter ${pdecl.raw} von ${pb.name} erwartet ein Array bzw. eine Struktur.`);
          if (pdecl.dims && pdecl.dims.length) {
            if (!loc.arr) this.abort(`Parameter ${pdecl.raw} ist ein Array – übergeben wurde kein Array.`);
            if (loc.bounds.length !== pdecl.dims.length)
              this.abort(`Parameter ${pdecl.raw} hat ${pdecl.dims.length} Dimension(en), das Argument ${loc.bounds.length}.`);
            const e0 = loc.el[0];
            if (e0 && !e0.st && !pdecl.children.length) {
              const pt = this.paramType(pdecl, e0.t, null, nf);
              if (!this.sameType(e0.t, pt))
                this.abort(
                  `Array-Argument für ${pdecl.raw}: Elementtyp ${PLI.typeName(e0.t)} passt nicht zu ${PLI.typeName(pt)}. Bei Arrays muss der Typ genau übereinstimmen.`
                );
            }
            if (pdecl.dims.some((d) => !d.star)) {
              // feste Grenzen müssen passen
              const pb2 = pdecl.dims.map((dm) => [dm.lo ? this.toInt(this.eval(dm.lo, nf)) : 1, this.toInt(this.eval(dm.hi, nf))]);
              const same = pb2.every((b, i) => b[0] === loc.bounds[i][0] && b[1] === loc.bounds[i][1]);
              if (!same) this.abort(`Die Grenzen des Array-Arguments passen nicht zum Parameter ${pdecl.raw}. Tipp: Parameter mit (*) deklarieren.`);
            }
          } else if (!loc.st) this.abort(`Parameter ${pdecl.raw} ist eine Struktur – übergeben wurde keine Struktur.`);
          else if (loc.m.length !== pdecl.children.length)
            this.abort(`Die Struktur-Argument ${loc.d.raw} passt nicht zum Parameter ${pdecl.raw} (unterschiedlicher Aufbau).`);
          return loc;
        }
        if (loc.arr || loc.st)
          this.abort(`Parameter ${pdecl.raw} von ${pb.name} erwartet einen einzelnen Wert, übergeben wurde ein Array bzw. eine Struktur.`);
        const pt = this.paramType(pdecl, loc.t, null, nf);
        if (this.sameType(loc.t, pt) && !loc.view) return loc;
        const an = argNode.parts.map((p) => p.raw).join('.');
        this.warn(
          `Argument ${an} (${PLI.typeName(loc.t)}) passt nicht zum Parameter ${pdecl.raw} (${PLI.typeName(pt)}) von ${pb.name}. PL/I übergibt deshalb eine KOPIE (Dummy-Argument) – Änderungen in ${pb.name} wirken NICHT auf ${an} zurück!`,
          argNode.line
        );
        const c = { d: pdecl, t: pt, v: null, set: false };
        this.assignTo(c, this.valueOfCell(loc));
        return c;
      }
      const v = this.eval(argNode, callerFrame);
      if (isAgg) {
        if (v.k === 'A' && pdecl.dims) {
          const el = v.vals.map((x) => {
            const c = { d: pdecl, t: this.paramType(pdecl, null, x, nf), v: null, set: false };
            this.assignTo(c, x);
            return c;
          });
          return { arr: true, d: pdecl, bounds: [[1, el.length]], el };
        }
        this.abort(`Parameter ${pdecl.raw} erwartet ein Array bzw. eine Struktur.`);
      }
      const c = { d: pdecl, t: this.paramType(pdecl, null, v, nf), v: null, set: false };
      this.assignTo(c, v);
      return c;
    }

    // ---------- Anweisungen ----------
    execList(list, frame) {
      let i = 0;
      const n = list.length;
      while (i < n) {
        const st = list[i];
        try {
          this.exec(st, frame);
          i++;
        } catch (e) {
          if (e instanceof GotoSig && e.label.list === list) {
            i = e.label.index;
            this.frame = frame;
            continue;
          }
          throw e;
        }
      }
    }
    exec(st, frame) {
      if (++this.steps > this.maxSteps)
        this.abort(`Programm nach ${this.maxSteps.toLocaleString('de-DE')} Anweisungen abgebrochen – vermutlich eine Endlosschleife (die Abbruchbedingung wird nie erfüllt).`);
      this.line = st.line;
      this.en = st.en !== undefined ? st.en : this.en;
      this.frame = frame;
      switch (st.type) {
        case 'null':
        case 'dcl':
        case 'proc':
          return;
        case 'assign':
          return this.execAssign(st, frame);
        case 'if':
          if (this.truth(this.eval(st.cond, frame))) this.exec(st.then, frame);
          else if (st.els) this.exec(st.els, frame);
          return;
        case 'do':
          return this.execDo(st, frame);
        case 'select':
          return this.execSelect(st, frame);
        case 'call': {
          const res = st.ref.res;
          if (res.kind === 'entryExt')
            this.abort(`Die externe Prozedur ${st.ref.parts[0].raw} ist nicht vorhanden – in der Lernumgebung müssen alle Prozeduren im selben Quelltext stehen.`);
          if (res.kind !== 'proc') this.abort(`${st.ref.parts[0].raw} ist keine Prozedur.`);
          this.callProc(res.block, st.ref.parts[0].args || [], frame, st, false);
          return;
        }
        case 'return':
          throw new ReturnSig(st.expr ? this.eval(st.expr, frame) : undefined);
        case 'goto':
          if (!st.target) this.abort('Sprungziel nicht gefunden.');
          throw new GotoSig(st.target);
        case 'leave':
          throw new LeaveSig(st.targetNode);
        case 'iterate':
          throw new IterateSig(st.targetNode);
        case 'stop':
          throw new StopSig('stop');
        case 'begin':
          return this.execBegin(st, frame, frame);
        case 'put':
          return this.execPut(st, frame);
        case 'get':
          return this.execGet(st, frame);
        case 'open':
          for (const g of st.groups) this.openFile(this.fileObj(g.file), g, frame);
          return;
        case 'close':
          for (const f of st.files) this.closeFile(this.fileObj(f));
          return;
        case 'read':
          return this.execRead(st, frame);
        case 'write':
          return this.execWrite(st, frame);
        case 'rewrite':
          return this.execRewrite(st, frame);
        case 'on': {
          if (!frame.on) frame.on = new Map();
          for (const c of st.conds) {
            const key = this.condKey(c.name, c.file ? this.fileName(c.file) : null, c.cname);
            frame.on.set(key, { unit: st.unit, frame, system: st.system, snap: st.snap });
          }
          return;
        }
        case 'revert':
          for (const c of st.conds) {
            const key = this.condKey(c.name, c.file ? this.fileName(c.file) : null, c.cname);
            if (frame.on) frame.on.delete(key);
          }
          return;
        case 'signal': {
          const c = st.cond;
          const info = { signal: true, fileName: c.file ? this.fileName(c.file) : undefined, cname: c.cname };
          if (c.name === 'ERROR') info.msg = 'SIGNAL ERROR ausgeführt.';
          this.raise(c.name, info);
          return;
        }
        case 'allocate':
          return this.execAllocate(st, frame);
        case 'free':
          return this.execFree(st, frame);
        case 'display': {
          const v = this.eval(st.expr, frame);
          this.display.push(this.toCharStr(v));
          return;
        }
      }
      this.abort(`Anweisung ${st.type} wird nicht unterstützt.`);
    }
    execBegin(st, statFrame, callerFrame) {
      const b = st.block;
      const nf = new Frame(b, statFrame, callerFrame);
      const save = this.frame;
      this.frame = nf;
      try {
        this.enterBlock(nf);
        this.execList(st.body, nf);
      } finally {
        this.frame = save;
      }
    }
    execAssign(st, frame) {
      if (st.op !== '=') {
        const bop = st.op.slice(0, -1);
        for (const t of st.targets) {
          const cur = this.eval(t, frame);
          const r = this.eval(st.expr, frame);
          this.store(t, this.binop(bop, cur, r, st), frame);
        }
        return;
      }
      const val = this.eval(st.expr, frame);
      for (const t of st.targets) {
        if (st.byName) {
          if (val.k !== 'S') this.abort('BY NAME braucht rechts eine Struktur.');
          this.assignByName(this.locate(t, frame), val.cell);
        } else this.store(t, val, frame);
      }
    }
    store(tref, val, frame) {
      const res = tref.res;
      if (res.kind === 'builtin') {
        const def = res.def;
        if (!def.pseudo) this.abort(`${tref.parts[0].raw} kann nicht als Ziel einer Zuweisung verwendet werden.`);
        return def.pseudo(this, tref.parts[0].args || [], frame, val, tref);
      }
      if (res.kind !== 'var') this.abort(`${tref.parts[0].raw} ist keine Variable.`);
      const loc = this.locate(tref, frame);
      this.assignTo(loc, val, tref);
    }
    bodyLoop(st, frame) {
      try {
        this.execList(st.body, frame);
      } catch (e) {
        if (e instanceof LeaveSig && e.target === st) return true;
        if (e instanceof IterateSig && e.target === st) return false;

      return false;

    loopHead(st, frame) {

      this.frame = frame;

    }
    execDo(st, frame) {
      switch (st.kind) {
        case 'group':
          try {
            this.execList(st.body, frame);
          } catch (e) {
            if ((e instanceof LeaveSig || e instanceof IterateSig) && e.target === st) return;
            throw e;
          }
          return;
        case 'forever':
          for (;;) {
            this.loopHead(st, frame);
            if (this.bodyLoop(st, frame)) return;
          }
        case 'while':
          for (;;) {
            this.loopHead(st, frame);
            if (st.while && !this.truth(this.eval(st.while, frame))) return;
            if (this.bodyLoop(st, frame)) return;
            this.loopHead(st, frame);
            if (st.until && this.truth(this.eval(st.until, frame))) return;

          for (const sp of st.specs) {

              const by = sp.by ? this.eval(sp.by, frame) : ONE;
              const byNeg = this.sign(by) < 0;
              this.store(st.ctrl, start, frame);
              for (;;) {
                this.loopHead(st, frame);

                if (to) {
                  const c = this.compare(cur, to);
                  if (byNeg ? c < 0 : c > 0) break;
                }
                if (sp.while && !this.truth(this.eval(sp.while, frame))) break;
                if (this.bodyLoop(st, frame)) return;
                this.loopHead(st, frame);
                if (sp.until && this.truth(this.eval(sp.until, frame))) break;
                this.store(st.ctrl, this.binop('+', this.eval(st.ctrl, frame), by, st), frame);
              }
            } else if (sp.repeat) {
              this.store(st.ctrl, start, frame);
              for (;;) {
                this.loopHead(st, frame);
                if (sp.while && !this.truth(this.eval(sp.while, frame))) break;
                if (this.bodyLoop(st, frame)) return;
                this.loopHead(st, frame);
                if (sp.until && this.truth(this.eval(sp.until, frame))) break;
                this.store(st.ctrl, this.eval(sp.repeat, frame), frame);
              }
            } else {
              this.store(st.ctrl, start, frame);
              if (sp.while && !this.truth(this.eval(sp.while, frame))) continue;

    }
    execSelect(st, frame) {

      if (st.other) {

        return;

    execFree(st, frame) {

          root.ctl.pop();
        } else {
          const p = ref.ptr ? this.eval(ref.ptr, frame) : this.eval(root.attrs.basedPtr, frame);
          if (!p.v) this.abort(`FREE über einen NULL-Zeiger.`);
          if (p.v.freed) this.abort(`Dieser Speicher wurde bereits freigegeben (doppeltes FREE).`);
          if (p.v.isAddr) this.abort('FREE geht nur für Speicher, der mit ALLOCATE angelegt wurde.');
          p.v.freed = true;
        }
      }
    }

    // ---------- Stream-I/O ----------
    fileName(fileRef) {

      return r && r.decl ? r.decl.name : fileRef.parts[0].name;
    }
    fileObj(fileRef) {

      return f;
    }
    openFile(f, g, frame, implicit) {
      if (f.open) return;
      const a = Object.assign({}, f.attrs);

      const has = (x) => ga[x] || a['f_' + x];

      let kind = has('RECORD') ? 'RECORD' : has('STREAM') ? 'STREAM' : (implicit && implicit.kind) || 'STREAM';

    closeFile(f) {

      }

    }
    closeAll() {
      for (const f of this.files.values()) this.closeFile(f);
    }
    ensureOpen(f, mode, kind, frame) {
      if (!f.open) this.openFile(f, null, frame, { mode, kind });
      if (!f.open) this.abort(`Datei ${f.name} konnte nicht geöffnet werden.`);
      if (f.kind !== kind)
        this.abort(
          `Datei ${f.name} ist als ${f.kind} geöffnet – ${kind === 'RECORD' ? 'READ/WRITE geht nur mit RECORD-Dateien' : 'GET/PUT geht nur mit STREAM-Dateien'}.`
        );
      if (mode === 'INPUT' && f.mode === 'OUTPUT') this.abort(`Datei ${f.name} ist zum Schreiben (OUTPUT) geöffnet – Lesen nicht möglich.`);
      if (mode === 'OUTPUT' && f.mode === 'INPUT') this.abort(`Datei ${f.name} ist zum Lesen (INPUT) geöffnet – Schreiben nicht möglich.`);
    }
    outStreamFor(fileRef, frame) {
      if (!fileRef) return this.out;
      const f = this.fileObj(fileRef);
      this.ensureOpen(f, 'OUTPUT', 'STREAM', frame);
      return f.out;
    }
    flattenValue(v, cb) {
      if (v.k === 'A') for (const x of v.vals) this.flattenValue(x, cb);
      else if (v.k === 'S') for (const c of this.leafCells(v.cell, [])) cb(this.valueOfCell(c));
      else cb(v);
    }
    forEachData(items, frame, cb) {
      for (const it of items) {
        if (it.type === 'repdo') this.repDo(it, frame, () => this.forEachData(it.items, frame, cb));
        else this.flattenValue(this.eval(it, frame), cb);
      }
    }
    repDo(it, frame, body) {
      for (const sp of it.specs) {
        const start = this.eval(sp.start, frame);
        if (sp.to || sp.by) {
          const to = sp.to ? this.eval(sp.to, frame) : null;
          const by = sp.by ? this.eval(sp.by, frame) : ONE;
          const neg = this.sign(by) < 0;
          this.store(it.ctrl, start, frame);
          for (;;) {
            if (++this.steps > this.maxSteps) this.abort('Zu viele Schritte – Endlosschleife?');
            const cur = this.eval(it.ctrl, frame);
            if (to) {
              const c = this.compare(cur, to);
              if (neg ? c < 0 : c > 0) break;
            }
            if (sp.while && !this.truth(this.eval(sp.while, frame))) break;
            body();
            if (sp.until && this.truth(this.eval(sp.until, frame))) break;
            this.store(it.ctrl, this.binop('+', this.eval(it.ctrl, frame), by), frame);
          }
        } else {
          this.store(it.ctrl, start, frame);

        }
      }
    }
    listRepr(v, print) {
      switch (v.k) {
        case 'C':
          return print ? v.v : "'" + v.v.replace(/'/g, "''") + "'";
        case 'B':
          return "'" + v.v + "'B";
        case 'F':
          if (v.pic) return this.toCharStr(v);
          return PLI.fixedToChar(v).trim();
        case 'E':
          return PLI.floatToChar(v.v, v.p).trim();
        case 'P':
          this.abort('Zeiger können nicht mit PUT ausgegeben werden.');
      }
      return '';
    }
    execPut(st, frame) {
      const stream = st.string ? new OutStream(false, 1e9, this) : this.outStreamFor(st.file, frame);
      if (st.page) stream.page();
      if (st.lineOpt) stream.toLine(this.toInt(this.eval(st.lineOpt, frame)));
      if (st.skip) stream.skip(this.toInt(this.eval(st.skip, frame)));
      if (st.mode === 'list') {

    }
    dataItems(ref, frame, out) {
      const loc = this.locate(ref, frame);
      const name = ref.parts.map((p) => p.raw.toUpperCase() + (p.args ? '(' + p.args.map((a) => this.toInt(this.eval(a, frame))).join(',') + ')' : '')).join('.');
      const rec = (cell, nm) => {
        if (cell.arr) {
          const idx = (i) => {
            const res = [];
            let r = i;
            for (let j = cell.bounds.length - 1; j >= 0; j--) {
              const [lo, hi] = cell.bounds[j];
              const ext = hi - lo + 1;
              res.unshift(lo + (r % ext));
              r = Math.floor(r / ext);
            }
            return res.join(',');
          };
          cell.el.forEach((e, i) => rec(e, nm + '(' + idx(i) + ')'));
        } else if (cell.st) for (const m of cell.m) rec(m, nm + '.' + m.d.raw.toUpperCase());

      rec(loc, name);
    }
    expandFormats(fmts, frame, out) {
      out = out || [];
      for (const f of fmts) {
        if (f.sub) {
          const n = f.rep ? this.toInt(this.eval(f.rep, frame)) : 1;
          for (let i = 0; i < n; i++) this.expandFormats(f.sub, frame, out);
        } else {
          out.push({
            code: f.code,
            w: f.args[0] ? this.toInt(this.eval(f.args[0], frame)) : null,
            d: f.args[1] ? this.toInt(this.eval(f.args[1], frame)) : 0,

    isControlFmt(f) {

    }
    formatF(v, w, d) {
      const a = this.toArith(v);
      let scaled;
      if (a.k === 'E') scaled = PLI.numberToScaled(a.v, d, true);
      else scaled = roundScale(a.v, a.q, d);
      let s = PLI.scaledToStr(scaled, d);
      if (s.length > w) {
        this.warn(`Der Wert ${s} passt nicht in das Format F(${w}${d ? ',' + d : ''}) – es werden Sterne ausgegeben.`, this.line);

      }
      return s.padStart(w);
    }
    formatE(v, w, d) {
      const x = this.toNum(v);
      let s = x.toExponential(Math.max(0, d));
      const m = /^(-?)([\d.]+)e([+-])(\d+)$/.exec(s);
      if (m) s = m[1] + m[2] + 'E' + m[3] + m[4].padStart(2, '0');
      if (s.length > w) return '*'.repeat(w);
      return s.padStart(w);
    }
    putEdit(stream, values, fmts, frame) {
      const fl = this.expandFormats(fmts, frame);
      if (values.length && !fl.some((f) => !this.isControlFmt(f)))

      let fi = 0, vi = 0;
      if (!values.length) {
        for (const f of fl) {

        }
        return;
      }
      while (vi < values.length) {
        if (fi >= fl.length) fi = 0;
        const f = fl[fi++];
        if (this.isControlFmt(f)) {

          continue;
        }
        const v = values[vi++];
        let s;
        switch (f.code) {
          case 'A': {
            const cs = this.toCharStr(v);
            s = f.w == null ? cs : cs.padEnd(f.w).slice(0, f.w);
            break;
          }
          case 'B': {
            const bs = this.toBitStr(v);
            s = f.w == null ? bs : bs.padEnd(f.w).slice(0, f.w);
            break;
          }
          case 'F':
            s = this.formatF(v, f.w, f.d);
            break;
          case 'E':
            s = this.formatE(v, f.w, f.d);
            break;
          case 'P': {
            const pic = f.pic;
            if (!pic) this.abort('Ungültiges P-Format.');
            if (pic.isChar) s = this.toCharStr(v).padEnd(pic.len).slice(0, pic.len);
            else {
              const a = this.toArith(v);
              const sv = a.k === 'E' ? PLI.numberToScaled(a.v, pic.q, false) : rescale(a.v, a.q, pic.q);
              s = PLI.formatPicture(pic, sv);
              if (s == null) {
                this.warn(`Der Wert passt nicht in P'${pic.src}' – es werden Sterne ausgegeben.`, this.line);

            break;
          }
        }
        stream.write(s);
      }
    }
    applyControl(stream, f) {
      switch (f.code) {
        case 'X':
          stream.write(' '.repeat(Math.max(0, f.w || 0)));
          break;
        case 'SKIP':
          stream.skip(f.w == null ? 1 : f.w);
          break;
        case 'COL':
          stream.col(f.w || 1);
          break;
        case 'LINE':
          stream.toLine(f.w);
          break;
        case 'PAGE':
          stream.page();
          break;
      }
    }
    forEachTarget(items, frame, cb) {
      for (const it of items) {
        if (it.type === 'repdo') {

          this.repDo(it, frame, () => {

          if (stop) return false;
        } else {

      return true;
    }
    execGet(st, frame) {
      let ins, f = null;
      if (st.string) ins = new InStream(this.toCharStr(this.eval(st.string, frame)));

      const eof = () => {
        if (st.string) this.raiseError('GET STRING: Die Zeichenkette enthält nicht genug Werte.');
        f.eof = true;
        this.raise('ENDFILE', { fileName: f.name });
        return false;
      };
      if (st.mode === 'list') {
        this.forEachTarget(st.items, frame, (cell) => {
          const tok = ins.readListItem();
          if (tok === null) return eof();
          if (tok.kind === 'null') return true;
          const v = tok.kind === 'bit' ? V.bit(tok.v) : V.char(tok.v);

      } else if (st.mode === 'edit') {
        for (const pr of st.edit) {
          const fl = this.expandFormats(pr.fmts, frame);
          let fi = 0;
          const ok = this.forEachTarget(pr.items, frame, (cell) => {
            for (let guard = 0; guard < 1000; guard++) {
              if (fi >= fl.length) fi = 0;
              const fm = fl[fi++];
              if (this.isControlFmt(fm)) {
                if (fm.code === 'X') {
                  if (ins.readChars(fm.w) === null) return eof();
                } else if (fm.code === 'SKIP') ins.skip(fm.w == null ? 1 : fm.w);
                else if (fm.code === 'COL') ins.col(fm.w);
                continue;
              }
              if (fm.w == null) this.abort(`Beim Einlesen braucht das Format ${fm.code} eine Breite, z.B. ${fm.code}(10).`);
              const s = ins.readChars(fm.w);
              if (s === null) return eof();
              let v;
              if (fm.code === 'A') v = V.char(s);
              else if (fm.code === 'B') v = V.bit(s.trim());
              else if (fm.code === 'F' || fm.code === 'E') {
                const t = s.trim();
                const n = PLI.parseNumber(t);
                if (!n) v = this.convError(s);
                else if (n.k === 'F' && fm.d && !t.includes('.')) v = V.fixed('D', n.p, fm.d, n.v);
                else v = n;
              } else if (fm.code === 'P') {
                const pv = PLI.picToValue(fm.pic, s);
                if (pv === null) v = this.convError(s);
                else v = V.fixed('D', fm.pic.p, fm.pic.q, pv);
              }
              this.assignTo(cell, v);
              return true;
            }
            return true;
          });
          if (ok === false) return;
        }
      }
    }

    // ---------- Record-I/O ----------
    fieldWidth(c) {
      if (c.view) return c.len;
      const t = c.t;
      if (t.k === 'C' && !t.vy) return t.len;
      if (t.k === 'PIC') return t.pic.len;
      if (t.k === 'C' && t.vy)
        this.abort(`VARYING-Felder (${this.qname(c.d)}) in Satzstrukturen werden nicht unterstützt (sie haben ein 2-Byte-Längenpräfix). Verwende CHAR fester Länge.`);
      this.abort(
        `Feld ${this.qname(c.d)} hat den Typ ${PLI.typeName(t)}. In Dateien der Lernumgebung (Textzeilen) können nur CHAR- und PICTURE-Felder stehen. Im echten Mainframe-Satz wären FIXED DEC-Felder gepackt (binär, z.B. X'12345C') – solche Daten kann man in einem Texteditor nicht sehen.`

    }
    recordInto(loc, rec, ref) {

          if (pv === null) this.convError(rec);

        }
        this.assignTo(loc, V.char(rec));
        return;
      }
      const leaves = this.leafCells(loc, []);
      let pos = 0;
      for (const c of leaves) {
        const w = this.fieldWidth(c);
        const s = rec.substr(pos, w).padEnd(w);
        pos += w;
        if (c.t && c.t.k === 'PIC') {
          const pv = PLI.picToValue(c.t.pic, s);
          if (pv === null) {
            this.raise('CONVERSION', { onsource: s, onchar: [...s].find((ch) => !/[0-9 ]/.test(ch)) });
            this.raiseError(`Ungültige Zeichen '${s}' im PICTURE-Feld ${this.qname(c.d)}.`);
          }
          c.v = Object.assign(V.fixed('D', c.t.p, c.t.q, pv), { pic: c.t.pic });
          c.set = true;
        } else this.assignTo(c, V.char(s));
      }
    }
    recordFrom(loc) {
      if (!loc.arr && !loc.st) {
        const v = this.valueOfCell(loc);
        return this.toCharStr(v);
      }
      let s = '';
      for (const c of this.leafCells(loc, [])) {
        const w = this.fieldWidth(c);
        s += this.toCharStr(this.valueOfCell(c)).padEnd(w).slice(0, w);
      }
      return s;
    }
    execRead(st, frame) {
      const f = this.fileObj(st.file);
      this.ensureOpen(f, 'INPUT', 'RECORD', frame);
      if (f.eof) this.raiseError(`READ nach dem Dateiende von ${f.name}. Prüfe dein EOF-Kennzeichen in der Schleifenbedingung.`);
      if (st.ignore) {
        const n = this.toInt(this.eval(st.ignore, frame));
        f.pos += n;
        if (f.pos > f.records.length) {
          f.pos = f.records.length;
          f.eof = true;
          this.raise('ENDFILE', { fileName: f.name });
        }
        return;
      }
      if (f.pos >= f.records.length) {
        f.eof = true;
        this.raise('ENDFILE', { fileName: f.name });
        return;
      }
      const rec = f.records[f.pos++];
      const loc = this.locate(st.into, frame);
      this.recordInto(loc, rec, st.into);
    }
    execWrite(st, frame) {
      const f = this.fileObj(st.file);
      this.ensureOpen(f, 'OUTPUT', 'RECORD', frame);
      if (f.mode === 'UPDATE') this.abort(`WRITE auf eine UPDATE-Datei wird nicht unterstützt – verwende REWRITE.`);
      const loc = this.locate(st.from, frame);
      f.records.push(this.recordFrom(loc));
      if (f.records.length > 50000) this.abort('Zu viele Sätze geschrieben.');
    }
    execRewrite(st, frame) {
      const f = this.fileObj(st.file);
      if (!f.open || f.mode !== 'UPDATE') this.abort(`REWRITE geht nur bei Dateien, die mit OPEN ... UPDATE geöffnet wurden.`);
      if (!f.pos) this.abort('REWRITE ohne vorheriges READ.');
      if (st.from) f.records[f.pos - 1] = this.recordFrom(this.locate(st.from, frame));
    }
  }

  PLI.Interp = Interp;
  PLI.OutStream = OutStream;
  PLI.InStream = InStream;

  // ---------- Öffentliche API ----------
  PLI.run = function (src, opts) {
    opts = opts || {};
    const diags = [];
    let prog, sem;
    try {
      prog = PLI.parse(src, diags);
      if (!diags.some((d) => d.sev === 'E')) sem = PLI.analyze(prog, diags);
    } catch (e) {
      if (e instanceof PLI.CompileError) diags.push({ sev: 'E', line: e.line, col: e.col, msg: e.message });
      else {
        diags.push({ sev: 'E', line: 1, col: 1, msg: 'Interner Fehler beim Übersetzen: ' + e.message });
        if (typeof console !== 'undefined') console.error(e);
      }
    }
    // gleiche Meldungen zusammenfassen
    const seen = new Set();
    const cdiags = diags.filter((d) => {
      const k = d.sev + d.line + d.msg;
      if (seen.has(k)) return false;
      seen.add(k);
      return true;
    });
    cdiags.sort((a, b) => a.line - b.line || a.col - b.col);
    const errors = cdiags.filter((d) => d.sev === 'E');
    if (errors.length || !sem || !sem.main) {
      return { status: 'compile-error', diags: cdiags, output: '', display: [], files: {}, runtimeError: null };
    }
    let res;
    try {
      const it = new Interp(sem, opts);
      res = it.run();
    } catch (e) {
      if (typeof console !== 'undefined') console.error(e);
      res = { status: 'error', runtimeError: { line: 0, msg: 'Interner Fehler der Lernumgebung: ' + e.message }, output: '', display: [], files: {}, diags: [] };
    }
    res.diags = cdiags.concat(res.diags || []);
    return res;
  };

  PLI.check = function (src) {
    const diags = [];
    try {
      const prog = PLI.parse(src, diags);
      if (!diags.some((d) => d.sev === 'E')) PLI.analyze(prog, diags);
    } catch (e) {
      if (e instanceof PLI.CompileError) diags.push({ sev: 'E', line: e.line, col: e.col, msg: e.message });
      else diags.push({ sev: 'E', line: 1, col: 1, msg: 'Interner Fehler: ' + e.message });
    }
    return diags;
  };
})(typeof window !== 'undefined' ? window : globalThis);

/* js/editor.js */
/* Kleiner Code-Editor mit PL/I-Syntaxhervorhebung, Zeilennummern und Fehlermarkierung */
(function (G) {
  'use strict';

  const KW = new Set(
    ('PROCEDURE PROC END DECLARE DCL IF THEN ELSE DO WHILE UNTIL TO BY REPEAT SELECT WHEN OTHERWISE OTHER CALL RETURN ' +
      'RETURNS GO GOTO LEAVE ITERATE PUT GET SKIP LIST EDIT DATA PAGE LINE FILE OPEN CLOSE READ WRITE REWRITE INTO FROM ' +
      'ON SIGNAL REVERT BEGIN STOP EXIT ALLOCATE ALLOC FREE SET OPTIONS MAIN RECURSIVE INIT INITIAL STATIC AUTOMATIC AUTO ' +
      'BASED CONTROLLED CTL DEFINED DEF POSITION POS LIKE FIXED FLOAT DECIMAL DEC BINARY BIN CHARACTER CHAR VARYING VAR ' +
      'BIT PICTURE PIC POINTER PTR ENTRY BUILTIN CONDITION COND RECORD STREAM INPUT OUTPUT UPDATE PRINT TITLE SYSTEM SNAP ' +
      'FOREVER LOOP DISPLAY VALUE EXTERNAL EXT ENVIRONMENT ENV SEQUENTIAL SEQL KEYED STRING PACKAGE DIMENSION ' +
      'ENDFILE ZERODIVIDE ZDIV CONVERSION CONV SIZE FIXEDOVERFLOW FOFL OVERFLOW OFL UNDERFLOW SUBSCRIPTRANGE SUBRG ' +
      'STRINGRANGE STRG STRINGSIZE ERROR FINISH UNDEFINEDFILE KEY NOSIZE NOCONVERSION NOFIXEDOVERFLOW NOZERODIVIDE ' +
      'NOSUBSCRIPTRANGE NOSTRINGRANGE NAME ALIGNED UNALIGNED INTERNAL').split(' ')
  );
  function builtinSet() {
    return G.PLI && G.PLI.BUILTINS ? G.PLI.BUILTINS : {};
  }
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  function tokenize(src) {
    const out = [];
    const re = /(\/\*[\s\S]*?(?:\*\/|$))|('(?:[^'\n]|'')*'?(?:BX|B4|B|X)?|"(?:[^"\n]|"")*"?)|(\d+(?:\.\d*)?(?:[Ee][+-]?\d+)?|\.\d+(?:[Ee][+-]?\d+)?)|([A-Za-z_@#$][A-Za-z0-9_@#$]*)|(\s+)|([\s\S])/gy;
    let m;
    const B = builtinSet();
    while ((m = re.exec(src))) {
      if (m[1] !== undefined) out.push(['c', m[1]]);
      else if (m[2] !== undefined) out.push(['s', m[2]]);
      else if (m[3] !== undefined) out.push(['n', m[3]]);
      else if (m[4] !== undefined) {
        const u = m[4].toUpperCase();
        out.push([KW.has(u) ? 'k' : B[u] ? 'b' : 'i', m[4]]);
      } else if (m[5] !== undefined) out.push(['', m[5]]);
      else out.push(['o', m[6]]);
      if (re.lastIndex >= src.length) break;
    }
    return out;
  }
  // liefert ein Array mit HTML pro Zeile
  function highlightLines(src) {
    const lines = [''];
    for (const [cls, text] of tokenize(src)) {
      const parts = text.split('\n');
      parts.forEach((p, i) => {
        if (i > 0) lines.push('');
        if (p) lines[lines.length - 1] += cls ? `<span class="t-${cls}">${esc(p)}</span>` : esc(p);
      });
    }
    return lines;
  }
  function highlight(src) {
    return highlightLines(src).join('\n');
  }

  class Editor {
    constructor(container, opts) {
      opts = opts || {};
      this.opts = opts;
      this.markers = new Map();
      const root = (this.el = document.createElement('div'));
      root.className = 'ed' + (opts.readOnly ? ' ed-ro' : '');
      root.innerHTML =
        '<div class="ed-scroll"><div class="ed-inner"><div class="ed-gutter" aria-hidden="true"></div>' +
        '<div class="ed-code"><pre class="ed-hl" aria-hidden="true"></pre><textarea class="ed-ta" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off"></textarea></div></div></div>';
      container.appendChild(root);
      this.scroll = root.querySelector('.ed-scroll');
      this.gutter = root.querySelector('.ed-gutter');
      this.pre = root.querySelector('.ed-hl');
      this.ta = root.querySelector('.ed-ta');
      this.ta.setAttribute('aria-label', opts.label || 'PL/I-Quelltext');
      if (opts.readOnly) this.ta.readOnly = true;
      if (opts.maxHeight) this.scroll.style.maxHeight = opts.maxHeight;
      if (opts.minLines) this.scroll.style.minHeight = opts.minLines * 21 + 18 + 'px';
      this.ta.value = opts.value || '';
      this.ta.addEventListener('input', () => {
        this.render();
        if (this.markers.size) {
          this.markers.clear();
          this.render();
        }
        if (opts.onChange) opts.onChange(this.ta.value);
      });
      this.ta.addEventListener('keydown', (e) => this.onKey(e));
      this.render();
    }
    getValue() {
      return this.ta.value;
    }
    setValue(v) {
      this.ta.value = v;
      this.markers.clear();
      this.render();
      if (this.opts.onChange) this.opts.onChange(v);
    }
    setMarkers(list) {
      this.markers.clear();
      for (const m of list || []) {
        if (!m.line) continue;
        const prev = this.markers.get(m.line);
        const rank = { E: 3, R: 3, W: 2, I: 1 };
        if (!prev || rank[m.sev] > rank[prev.sev]) this.markers.set(m.line, { sev: m.sev, msg: m.msg });
        else prev.msg += '\n' + m.msg;
      }
      this.render();
    }
    render() {
      const v = this.ta.value;
      const lines = highlightLines(v);
      let html = '';
      let gut = '';
      for (let i = 0; i < lines.length; i++) {
        const mk = this.markers.get(i + 1);
        const cls = mk ? ' mk-' + mk.sev : '';
        html += `<div class="l${cls}">${lines[i] || ' '}</div>`;
        gut += `<div class="g${cls}"${mk ? ` title="${esc(mk.msg).replace(/"/g, '&quot;')}"` : ''}>${i + 1}</div>`;
      }
      this.pre.innerHTML = html;
      this.gutter.innerHTML = gut;
    }
    focus() {
      this.ta.focus();
    }
    gotoLine(n, col) {
      const lines = this.ta.value.split('\n');
      let pos = 0;
      for (let i = 0; i < Math.min(n - 1, lines.length); i++) pos += lines[i].length + 1;
      pos += Math.max(0, (col || 1) - 1);
      this.ta.focus();
      this.ta.setSelectionRange(pos, pos);
      const lh = 21;
      const top = (n - 1) * lh;
      if (top < this.scroll.scrollTop || top > this.scroll.scrollTop + this.scroll.clientHeight - 2 * lh)
        this.scroll.scrollTop = Math.max(0, top - 3 * lh);
      this.el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
    insert(text) {
      this.ta.focus();
      if (!document.execCommand || !document.execCommand('insertText', false, text)) {
        const s = this.ta.selectionStart, e = this.ta.selectionEnd;
        this.ta.setRangeText(text, s, e, 'end');
        this.ta.dispatchEvent(new Event('input'));
      }
    }
    onKey(e) {
      if (this.ta.readOnly) return;
      const ta = this.ta;
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        if (this.opts.onRun) this.opts.onRun();
        return;
      }
      if (e.key === 'Tab') {
        e.preventDefault();
        const s = ta.selectionStart, en = ta.selectionEnd;
        const v = ta.value;
        if (s !== en && v.slice(s, en).includes('\n')) {
          const ls = v.lastIndexOf('\n', s - 1) + 1;
          const block = v.slice(ls, en);
          const nb = e.shiftKey ? block.replace(/^ {1,2}/gm, '') : block.replace(/^/gm, '  ');
          ta.setSelectionRange(ls, en);
          this.insert(nb);
          ta.setSelectionRange(ls, ls + nb.length);
        } else if (e.shiftKey) {
          const ls = v.lastIndexOf('\n', s - 1) + 1;
          if (v.slice(ls, ls + 2) === '  ') {
            ta.setSelectionRange(ls, ls + 2);
            this.insert('');
            ta.setSelectionRange(Math.max(ls, s - 2), Math.max(ls, s - 2));
          }
        } else this.insert('  ');
        return;
      }
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const s = ta.selectionStart;
        const v = ta.value;
        const ls = v.lastIndexOf('\n', s - 1) + 1;
        const line = v.slice(ls, s);
        let ind = (/^\s*/.exec(line) || [''])[0];
        const u = line.toUpperCase().replace(/\/\*.*?\*\//g, '').trim();
        if (/(^|[\s:;])(DO|BEGIN)\b[^;]*;$/.test(u) || /\bTHEN\s+DO\s*;$/.test(u) || /^(\w+\s*:\s*)?SELECT\b.*;$/.test(u) || /:\s*(PROC|PROCEDURE)\b.*;$/.test(u) || /ELSE\s+DO\s*;$/.test(u))
          ind += '  ';
        this.insert('\n' + ind);
        return;
      }
    }
  }

  G.PLIEditor = Editor;
  G.PLIHighlight = highlight;
})(window);

      aufgabe:
        '<p>Lies beliebig viele Zahlen aus SYSIN, bis die Eingabe zu Ende ist. Gib danach Anzahl, Summe und Durchschnitt (mit 2 Nachkommastellen) aus, z.B. für <code>10 20 30 45.5</code>:</p><pre>Anzahl: 4\nSumme: 105.50\nDurchschnitt: 26.37</pre><p>Ist die Eingabe leer, gib nur <code>Keine Zahlen</code> aus. Verwende das Lese-Muster mit <code>ON ENDFILE(SYSIN)</code> aus der Theorie. Für die Fallunterscheidung brauchst du ein <code>IF ... THEN ... ELSE</code> – das funktioniert wie in Java, nur ohne Klammern um die Bedingung und mit <code>THEN</code>; mehrere Anweisungen kommen in <code>DO; ... END;</code>.</p>',
      start: `STATISTIK: PROC OPTIONS(MAIN);

      loesung: `STATISTIK: PROC OPTIONS(MAIN);
  DCL ZAHL   FIXED DEC(9,2);
  DCL SUMME  FIXED DEC(11,2) INIT(0);
  DCL ANZAHL FIXED BIN(31)   INIT(0);
  DCL SCHNITT FIXED DEC(11,2);
  DCL EOF    BIT(1) INIT('0'B);

  ON ENDFILE(SYSIN) EOF = '1'B;
  GET LIST(ZAHL);
  DO WHILE(¬EOF);
    ANZAHL = ANZAHL + 1;
    SUMME  = SUMME + ZAHL;
    GET LIST(ZAHL);
  END;
  IF ANZAHL = 0 THEN
    PUT SKIP LIST('Keine Zahlen');
  ELSE DO;
    SCHNITT = SUMME / ANZAHL;
    PUT SKIP LIST('Anzahl:', ANZAHL);
    PUT SKIP LIST('Summe:', SUMME);
    PUT SKIP EDIT('Durchschnitt:', SCHNITT)(A, X(1), F(10,2));

END STATISTIK;`,

  <script>

(window.KAPITEL = window.KAPITEL || []).push({
  nr: 5,
  titel: 'Verzweigungen: IF, DO-Gruppen und SELECT',
  kurz: 'Bedingungen, Anweisungsgruppen mit DO; ... END;, das „hängende ELSE“ und Mehrfachauswahl mit SELECT.',
  theorie: [
    { h: 'IF ... THEN ... ELSE' },
    {
      p: 'Nach <code>IF</code> folgt eine Bedingung, dann <code>THEN</code> und <b>genau eine</b> Anweisung. Optional folgt <code>ELSE</code> mit wieder genau einer Anweisung. Klammern um die Bedingung sind nicht nötig (aber erlaubt).',
    },
    {
      java: `if (betrag > 1000) {
  rabatt = 5;
  System.out.println("Großkunde");
} else {
  rabatt = 0;
}`,
      pli: `IF BETRAG > 1000 THEN DO;
  RABATT = 5;
  PUT SKIP LIST('Großkunde');
END;
ELSE
  RABATT = 0;`,
      note: 'Was in Java die geschweiften Klammern sind, ist in PL/I die <b>DO-Gruppe</b> <code>DO; ... END;</code>.',
    },
    {
      titel: 'IF mit DO-Gruppen',
      code: `WENN: PROC OPTIONS(MAIN);
  DCL BETRAG FIXED DEC(7,2) INIT(1250.00);
  DCL RABATT FIXED DEC(3)   INIT(0);
  IF BETRAG > 1000 THEN DO;
    RABATT = 5;
    PUT SKIP LIST('Großkunde');
  END;
  ELSE
    PUT SKIP LIST('Normalkunde');
  PUT SKIP LIST('Rabatt in Prozent:', RABATT);
END WENN;`,
    },
    {
      warn: 'Ohne <code>DO; ... END;</code> gehört nur die <b>erste</b> Anweisung zum THEN-Zweig. Die Einrückung täuscht! Bei <code>IF X &gt; 0 THEN A = 1; B = 2;</code> wird <code>B = 2;</code> immer ausgeführt. Steht danach noch ein ELSE, meldet der Compiler „ELSE ohne IF“.',
    },
    { h: 'Bedingungen sind Bitstrings' },
    {
      p: 'Ein Vergleich liefert <code>\'1\'B</code> oder <code>\'0\'B</code>. IF prüft, ob <b>irgendein Bit</b> den Wert 1 hat. Deshalb kann man <code>BIT(1)</code>-Variablen direkt als Bedingung verwenden – wie Booleans in Java.',
    },
    {
      titel: 'Bit-Variablen als Bedingung',
      code: `FLAGS: PROC OPTIONS(MAIN);
  DCL GEFUNDEN BIT(1) INIT('0'B);
  DCL KUNDE    CHAR(10) INIT('Meier');
  IF KUNDE = 'Meier' THEN GEFUNDEN = '1'B;
  IF GEFUNDEN THEN PUT SKIP LIST('Kunde gefunden');
  IF ¬GEFUNDEN THEN PUT SKIP LIST('nicht gefunden');
END FLAGS;`,
    },
    {
      tip: 'Beachte <code>KUNDE = \'Meier\'</code>: KUNDE hat 10 Zeichen, die Konstante nur 5. Beim Vergleich von Zeichenketten wird die kürzere <b>mit Leerzeichen aufgefüllt</b> – darum ist der Vergleich wahr. Ein <code>equals</code> mit <code>trim()</code> wie in Java ist also meist nicht nötig.',
    },
    {
      titel: 'Falle: „ist 1 oder 2“',
      code: `ODER: PROC OPTIONS(MAIN);
  DCL A FIXED BIN(31) INIT(5);
  IF A = 1 | 2 THEN               /* gemeint: A = 1 oder A = 2 */
    PUT SKIP LIST('Falsch: Das wird IMMER ausgegeben!');
  IF A = 1 | A = 2 THEN           /* richtig */
    PUT SKIP LIST('A ist 1 oder 2');
  ELSE
    PUT SKIP LIST('A ist weder 1 noch 2');
END ODER;`,
    },
    {
      p: '<code>A = 1 | 2</code> bedeutet <code>(A = 1) | 2</code>. Die 2 wird in einen Bitstring umgewandelt (<code>\'0010\'B</code>) – der hat ein 1-Bit, also ist der ganze Ausdruck immer wahr.',
    },
    { h: 'Verschachtelte IFs und das „hängende ELSE“' },
    {
      p: 'Ein <code>ELSE</code> gehört immer zum <b>nächsten</b> vorangehenden <code>IF</code>, das noch kein ELSE hat – egal wie eingerückt ist. Wenn du es anders willst, brauchst du eine DO-Gruppe oder ein leeres ELSE (<code>ELSE;</code>).',
    },
    {
      titel: 'ELSE IF-Ketten',
      code: `STAFFEL: PROC OPTIONS(MAIN);

  IF UMSATZ >= 10000 THEN STUFE = 'Gold';
  ELSE IF UMSATZ >= 5000 THEN STUFE = 'Silber';

    },
    { h: 'SELECT – die Mehrfachauswahl' },
    {
      p: '<code>SELECT</code> entspricht <code>switch</code> in Java – ist aber sicherer: Es gibt <b>kein Durchfallen</b> (kein <code>break</code> nötig), ein WHEN darf mehrere Werte haben, und die Werte dürfen beliebige Ausdrücke sein, auch Zeichenketten.',

      p: 'Ohne Ausdruck nach SELECT stehen in den WHEN-Klammern Bedingungen. Die erste wahre Bedingung gewinnt – das ist eine übersichtlichere Form der ELSE-IF-Kette:',

    {
      code: `L1: PROC OPTIONS(MAIN);

      start: `PRIM: PROC OPTIONS(MAIN);

      END;
    END;
    IF IST_PRIM THEN DO;
      IF MOD(ANZAHL, 10) = 0 THEN PUT SKIP;   /* alle 10 Zahlen neue Zeile */
      PUT EDIT(Z)(F(5));
      ANZAHL = ANZAHL + 1;
    END;
  END;
  IF ANZAHL = 0 THEN PUT SKIP LIST('Keine Primzahlen');
END PRIM;`,
      erklaerung: '<code>DO T = 2 REPEAT T + 1 WHILE(T * T &lt;= Z)</code> ist eine elegante PL/I-Form: Startwert 2, danach jeweils T + 1, solange die WHILE-Bedingung gilt. Genauso gut geht <code>T = 2; DO WHILE(T * T &lt;= Z); ... T = T + 1; END;</code>.',
      tipps: [
        'Äußere Schleife über alle Kandidaten: <code>DO Z = 2 TO N;</code>',
        'Innere Schleife: Teiler T ab 2, solange <code>T * T &lt;= Z</code>. Findest du einen Teiler, setze <code>IST_PRIM = \'0\'B;</code> und verlasse die innere Schleife mit <code>LEAVE;</code>.',
        'Zeilenumbruch: Wenn <code>MOD(ANZAHL, 10) = 0</code>, vor der Ausgabe <code>PUT SKIP;</code> ausführen.',
      ],
      tests: [{ sysin: '30' }, { sysin: '50' }, { sysin: '2' }, { sysin: '1', name: 'Keine Primzahlen' }, { sysin: '120' }],
    },
  ],
});

END NAME;`,
      tipps: ['Du brauchst <code>LENGTH</code>, <code>UPPERCASE</code> und <code>REVERSE</code>.', 'Weil N VARYING ist, liefert LENGTH die echte Länge des Namens.'],

END UMDREHEN;`,
      tipps: ["Finde das Komma mit <code>INDEX(EIN, ',')</code>.", 'Der Nachname ist <code>SUBSTR(EIN, 1, P - 1)</code>, der Vorname <code>SUBSTR(EIN, P + 1)</code>. Beide mit TRIM säubern.'],
      pruefe: [{ re: '\\bINDEX\\b', msg: 'Suche das Komma mit INDEX.' }],

        "<p>Lies einen Satz ein (in Hochkommas). Die Wörter sind durch ein oder mehrere Leerzeichen getrennt. Gib jedes Wort nummeriert in einer eigenen Zeile aus, danach die Anzahl und das längste Wort (bei Gleichstand das erste):</p><pre>1: PL/I\n2: läuft\n3: auf\n4: dem\n5: Mainframe\nWörter: 5\nLängstes Wort: Mainframe</pre><p>Ein leerer Satz ergibt nur <code>Wörter: 0</code>.</p>",

  DCL SATZ   CHAR(200) VARYING;
  DCL WORT   CHAR(200) VARYING;
  DCL LANG   CHAR(200) VARYING INIT('');
  DCL (POS, ENDE, N) FIXED BIN(31);
  GET LIST(SATZ);
  N = 0;

END WOERTER;`,
      loesung: `WOERTER: PROC OPTIONS(MAIN);
  DCL SATZ   CHAR(200) VARYING;
  DCL WORT   CHAR(200) VARYING;
  DCL LANG   CHAR(200) VARYING INIT('');
  DCL (POS, ENDE, N) FIXED BIN(31);
  GET LIST(SATZ);
  N = 0;
  SATZ = TRIM(SATZ);
  DO WHILE(LENGTH(SATZ) > 0);
    ENDE = INDEX(SATZ, ' ');
    IF ENDE = 0 THEN ENDE = LENGTH(SATZ) + 1;   /* letztes Wort */
    WORT = SUBSTR(SATZ, 1, ENDE - 1);
    N = N + 1;
    PUT SKIP LIST(TRIM(N) || ': ' || WORT);
    IF LENGTH(WORT) > LENGTH(LANG) THEN LANG = WORT;
    IF ENDE > LENGTH(SATZ) THEN SATZ = '';
    ELSE SATZ = TRIM(SUBSTR(SATZ, ENDE));        /* Rest ohne führende Leerzeichen */
  END;
  PUT SKIP LIST('Wörter: ' || TRIM(N));
  IF N > 0 THEN PUT SKIP LIST('Längstes Wort: ' || LANG);
END WOERTER;`,
      tipps: [
        'Säubere den Satz mit TRIM. Solange er nicht leer ist: Suche das nächste Leerzeichen mit INDEX.',
        'Gibt es kein Leerzeichen mehr, ist der ganze Rest das letzte Wort.',

      tests: [{ sysin: "'PL/I läuft auf dem Mainframe'" }, { sysin: "'  viele    Leerzeichen   hier '" }, { sysin: "'Einwort'" }, { sysin: "''", name: 'Leerer Satz' }, { sysin: "'gleich lang auch'" }],
    },
  ],
});
