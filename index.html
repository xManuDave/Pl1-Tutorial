<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PL/I-Lernpfad</title>
  <meta name="description" content="Interaktives PL/I-Tutorial mit eingebautem Interpreter: Theorie, Code lesen, Code schreiben.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23173b6c'/%3E%3Ctext x='32' y='42' font-family='monospace' font-size='26' font-weight='bold' fill='%2338e08c' text-anchor='middle'%3EPL1%3C/text%3E%3C/svg%3E">
  <style>
:root {
  --bg: #f4f6fa;
  --surface: #ffffff;
  --surface-2: #eef1f7;
  --text: #1c2333;
  --muted: #5d6779;
  --line: #dde2eb;
  --primary: #1f5fbf;
  --primary-d: #164a96;
  --success: #1b8a4b;
  --danger: #c0362c;
  --warn: #a86a0c;
  --navy: #12233d;
  --green: #38e08c;
  --radius: 10px;
  --mono: ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
  --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 70px; }
body { margin: 0; font-family: var(--sans); background: var(--bg); color: var(--text); line-height: 1.6; font-size: 16px; }
a { color: var(--primary); }
code { font-family: var(--mono); font-size: 0.9em; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
h1, h2, h3 { line-height: 1.25; }
h2 { margin-top: 2.2rem; font-size: 1.45rem; border-bottom: 1px solid var(--line); padding-bottom: .3rem; }
h3 { font-size: 1.15rem; margin-top: 1.6rem; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
[hidden] { display: none !important; }

/* ---------- Kopfzeile ---------- */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 18px; height: 56px; padding: 0 18px; background: var(--navy); color: #fff; box-shadow: 0 1px 0 rgba(0,0,0,.2); }
.brand { color: #fff; text-decoration: none; font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.logo { font-family: var(--mono); background: #0a1528; color: var(--green); padding: 2px 8px; border-radius: 6px; border: 1px solid #27406b; }
.topnav { display: flex; gap: 4px; }
.topnav a { color: #c8d4ea; text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: .95rem; }
.topnav a:hover, .topnav a.active { background: rgba(255,255,255,.1); color: #fff; }
.total-progress { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: .85rem; color: #c8d4ea; }
.total-progress .bar { width: 120px; background: rgba(255,255,255,.15); }
.menu-btn { display: none; background: none; border: 0; color: #fff; font-size: 1.4rem; cursor: pointer; }

.bar { height: 7px; border-radius: 4px; background: var(--surface-2); overflow: hidden; flex: 1; }
.bar span { display: block; height: 100%; background: linear-gradient(90deg, #2fbf71, var(--green)); border-radius: 4px; transition: width .3s; }

/* ---------- Layout ---------- */
.layout { display: flex; min-height: calc(100vh - 56px); }
.sidebar { width: 280px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--line); padding: 16px 10px; position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto; }
.side-h { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 0 10px 8px; }
.nav-k { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; text-decoration: none; color: var(--text); font-size: .92rem; }
.nav-k:hover { background: var(--surface-2); }
.nav-k.active { background: #e4ecfa; color: var(--primary-d); font-weight: 600; }
.nk-nr { width: 24px; height: 24px; flex-shrink: 0; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: .78rem; font-weight: 700; color: var(--muted); }
.nav-k.complete .nk-nr { background: #d6f3e2; color: var(--success); }
.nk-t { flex: 1; line-height: 1.3; }
.nk-p { font-size: .75rem; color: var(--muted); }
.nav-k.complete .nk-p { color: var(--success); font-weight: 700; }
.side-links { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 12px; display: flex; flex-direction: column; }
.side-links a { padding: 6px 10px; text-decoration: none; border-radius: 8px; font-size: .92rem; }
.side-links a:hover { background: var(--surface-2); }
main { flex: 1; min-width: 0; padding: 28px clamp(16px, 4vw, 56px) 80px; max-width: 1080px; outline: none; }

/* ---------- Buttons ---------- */
.btn { font: inherit; font-size: .92rem; border: 1px solid var(--line); background: var(--surface); color: var(--text); padding: 7px 14px; border-radius: 8px; cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s; }
.btn:hover { background: var(--surface-2); }
.btn.armed { background: #fff3d6; border-color: #e0b04a; color: #6b4a00; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: var(--primary-d); }
.btn.success { background: var(--success); border-color: var(--success); color: #fff; font-weight: 600; }
.btn.success:hover { background: #166f3c; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.ghost { background: transparent; }
.btn.small { padding: 3px 9px; font-size: .82rem; }
.btn.big { padding: 11px 20px; font-size: 1rem; }
.btn.mono { font-family: var(--mono); min-width: 32px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0; }

/* ---------- Startseite ---------- */
.hero h1 { font-size: clamp(1.6rem, 3vw, 2.2rem); margin: .2em 0 .4em; }
.hero h1 code { font-size: .85em; }
.lead { font-size: 1.08rem; color: #3a4457; }
.steps-intro li { margin: .3em 0; }
.progress-line { display: flex; align-items: center; gap: 12px; margin: 10px 0 24px; }
.progress-line .bar { max-width: 360px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-bottom: 28px; }
.tile { display: flex; flex-direction: column; gap: 4px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); text-decoration: none; color: var(--text); transition: transform .12s, box-shadow .12s; }
.tile:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(20,40,80,.08); }
.tile.complete { border-color: #9ed8b6; }
.tile-nr { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.tile-t { font-weight: 700; font-size: 1.02rem; }
.tile-d { font-size: .86rem; color: var(--muted); flex: 1; }
.tile-p { display: flex; align-items: center; gap: 8px; font-size: .78rem; color: var(--muted); margin-top: 6px; }

/* ---------- Kapitel ---------- */
.chap-head h1 { margin: .1em 0 .2em; font-size: clamp(1.5rem, 3vw, 2rem); }
.crumb { font-size: .82rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.steps { display: flex; gap: 6px; margin: 18px 0 22px; border-bottom: 2px solid var(--line); flex-wrap: wrap; }
.step { padding: 9px 16px; text-decoration: none; color: var(--muted); font-weight: 600; border-bottom: 3px solid transparent; margin-bottom: -2px; }
.step:hover { color: var(--text); }
.step.active { color: var(--primary); border-bottom-color: var(--primary); }
.step small { font-weight: 500; background: var(--surface-2); border-radius: 10px; padding: 0 7px; margin-left: 4px; }
.chap-body > p, .chap-body > ul, .chap-body > ol { max-width: 78ch; }
.next-nav { margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; }

.box { border-radius: var(--radius); padding: 12px 16px; margin: 16px 0; border: 1px solid; max-width: 82ch; }
.box b:first-child { display: block; margin-bottom: 2px; }
.box.tip { background: #eef6ff; border-color: #c3dbf7; }
.box.warn { background: #fff6e8; border-color: #f2d39c; }
.box.oop { background: #f5f0ff; border-color: #d9cbf7; }
.box.praxis { background: #eefaf3; border-color: #bfe6cf; }

.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0 6px; }
.cmp-col { background: #14181f; border-radius: var(--radius); overflow: hidden; min-width: 0; }
.cmp-h { font-size: .8rem; font-weight: 700; padding: 6px 12px; background: #20262f; color: #c9d1d9; }
.cmp-col.java .cmp-h { color: #f0b37e; }
.cmp-col.pli .cmp-h { color: var(--green); }
.cmp-col pre { margin: 0; }
.cmp-note { font-size: .92rem; color: var(--muted); margin-top: 4px; }
.static-code { margin: 0; padding: 12px 14px; background: #14181f; color: #e6edf3; font-family: var(--mono); font-size: 13.5px; line-height: 1.55; overflow-x: auto; border-radius: var(--radius); }
.cmp-col .static-code { border-radius: 0; }

.tbl-wrap { overflow-x: auto; margin: 14px 0; }
.tbl { border-collapse: collapse; width: 100%; font-size: .92rem; background: var(--surface); }
.tbl th, .tbl td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
.tbl th { background: var(--surface-2); font-weight: 700; }
.tbl td code { white-space: nowrap; }
.filter { font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; width: min(420px, 100%); }

/* ---------- Codeblöcke & Runner ---------- */
.codeblock { margin: 16px 0 20px; }
.cb-title { font-size: .85rem; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
.runner { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 10px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.toolbar .ins { display: flex; gap: 2px; }
.toolbar .extra { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-left: auto; }
.runner.compact .toolbar { order: 2; border-bottom: 0; border-top: 1px solid var(--line); padding: 6px 10px; }
.runner.compact { display: flex; flex-direction: column; }
.runner.compact .ed-host { order: 1; }
.runner.compact .result { order: 3; }

.ed { background: #14181f; color: #e6edf3; font-family: var(--mono); font-size: 14px; line-height: 21px; }
.ed-scroll { overflow: auto; max-height: 480px; }
.ed-inner { display: flex; min-width: 100%; width: max-content; }
.ed-gutter { flex-shrink: 0; padding: 9px 0; background: #1a1f28; color: #5c6574; text-align: right; user-select: none; position: sticky; left: 0; z-index: 2; border-right: 1px solid #262c37; }
.ed-gutter .g { padding: 0 10px 0 12px; min-width: 44px; height: 21px; }
.ed-gutter .g.mk-E { background: #c0362c; color: #fff; cursor: help; }
.ed-gutter .g.mk-W { background: #a86a0c; color: #fff; cursor: help; }
.ed-gutter .g.mk-I { background: #285a9c; color: #fff; cursor: help; }
.ed-code { position: relative; flex: 1; min-width: 0; }
.ed-hl, .ed-ta { margin: 0; padding: 9px 14px; font: inherit; line-height: 21px; white-space: pre; tab-size: 2; letter-spacing: 0; }
.ed-hl { pointer-events: none; min-width: 100%; width: max-content; }
.ed-hl .l { height: 21px; }
.ed-hl .l.mk-E { background: rgba(255, 70, 70, .2); }
.ed-hl .l.mk-W { background: rgba(255, 180, 40, .14); }
.ed-hl .l.mk-I { background: rgba(80, 150, 255, .12); }
.ed-ta { position: absolute; inset: 0; width: 100%; height: 100%; resize: none; border: 0; outline: none; background: transparent; color: transparent; caret-color: #fff; overflow: hidden; }
.ed-ta::selection { background: rgba(120, 170, 255, .35); color: transparent; }
.ed-ro .ed-ta { caret-color: transparent; }
.t-k { color: #79b8ff; font-weight: 600; }
.t-b { color: #56d4bc; }
.t-c { color: #7d8799; font-style: italic; }
.t-s { color: #f0b37e; }
.t-n { color: #c69ff5; }
.t-o { color: #c9d1d9; }
.t-i { color: #e6edf3; }

.io { border-top: 1px solid var(--line); }
.io-tabs { display: flex; gap: 2px; padding: 6px 8px 0; background: var(--surface-2); }
.io-tabs .tab { border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; background: transparent; padding: 5px 12px; font-size: .85rem; }
.io-tabs .tab.active { background: var(--surface); border-color: var(--line); font-weight: 600; }
.pane { padding: 10px; }
.sysin-ta, .file-ta { width: 100%; font-family: var(--mono); font-size: 13.5px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; resize: vertical; background: #fbfcfe; }
.files { display: flex; flex-direction: column; gap: 10px; }
.file-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: .88rem; }
.file-head .dd { color: var(--muted); font-size: .78rem; text-transform: uppercase; }
.file-head .btn { margin-left: auto; }
.file-add { display: flex; gap: 8px; margin-top: 10px; }
.file-add input { font: inherit; font-size: .88rem; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; text-transform: uppercase; width: 200px; }
.file-add input.invalid { border-color: var(--danger); }

.result { padding: 10px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.res-status { font-weight: 700; font-size: .92rem; }
.res-status.ok { color: var(--success); }
.res-status.bad { color: var(--danger); }
.rterr { background: #fdecea; border: 1px solid #f3c1bc; color: #7d1d15; padding: 8px 12px; border-radius: 8px; font-size: .92rem; }
.diags { list-style: none; margin: 0; padding: 0; font-size: .9rem; display: flex; flex-direction: column; gap: 4px; }
.diags li { padding: 6px 10px; border-radius: 6px; border-left: 4px solid; background: var(--surface-2); }
.diags li.d-E { border-color: var(--danger); background: #fdf0ee; }
.diags li.d-W { border-color: var(--warn); background: #fff8ea; }
.diags li.d-I { border-color: #3d79c9; background: #eef5ff; }
.diags .sev { font-weight: 700; font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; }
.diags .d-E .sev { color: var(--danger); }
.diags .d-W .sev { color: var(--warn); }
.diags .d-I .sev { color: #2c64ad; }
.diags .rt { color: var(--muted); font-size: .8rem; }
.console { border-radius: 8px; overflow: hidden; border: 1px solid #1f3a2c; }
.con-h { background: #10261b; color: #8fd9b0; font-size: .75rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 4px 10px; }
.con-b { margin: 0; padding: 10px 12px; background: #07110c; color: var(--green); font-family: var(--mono); font-size: 13.5px; line-height: 1.45; overflow-x: auto; max-height: 420px; min-height: 2.6em; }
.con-b.empty { color: #4f7f63; font-style: italic; }
.console.log { border-color: #3a3220; }
.console.log .con-h { background: #2a2417; color: #e8cf94; }
.console.log .con-b { background: #15120b; color: #f1d58e; }
.console.file { border-color: #22324d; }
.console.file .con-h { background: #172540; color: #a9c4f5; }
.console.file .con-b { background: #0b1222; color: #cfe0ff; }

/* ---------- Übungskarten ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin: 22px 0; box-shadow: 0 1px 2px rgba(20,40,80,.04); }
.card-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.card-h h3 { margin: 0; font-size: 1.12rem; }
.pill { font-size: .76rem; font-weight: 700; padding: 2px 10px; border-radius: 20px; background: var(--surface-2); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.pill.lvl-leicht { background: #dff3e7; color: #1b7a43; }
.pill.lvl-mittel { background: #fff0d6; color: #8a5a06; }
.pill.lvl-schwer { background: #fde3e0; color: #a3261c; }
.done { color: var(--success); font-weight: 700; font-size: .9rem; }
.task { margin-bottom: 12px; }
.task p:first-child { margin-top: 0; }
.task pre { background: var(--surface-2); padding: 8px 12px; border-radius: 8px; font-family: var(--mono); font-size: 13px; overflow-x: auto; }
.question { font-weight: 700; margin: 14px 0 8px; }
.given { font-size: .9rem; margin: 8px 0; }
.given pre { margin: 4px 0 0; background: var(--surface-2); padding: 6px 10px; border-radius: 6px; font-family: var(--mono); font-size: 13px; overflow-x: auto; }
.options { display: flex; flex-direction: column; gap: 6px; }
.opt { display: flex; align-items: flex-start; gap: 10px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; transition: background .12s; }
.opt:hover { background: var(--surface-2); }
.opt input { margin-top: 5px; }
.opt pre { margin: 0; font-family: var(--mono); font-size: 13px; white-space: pre; overflow-x: auto; }
.opt.right { border-color: var(--success); background: #e6f6ec; }
.opt.wrong { border-color: var(--danger); background: #fdeeec; }
.feedback { padding: 10px 14px; border-radius: 8px; margin-top: 8px; }
.feedback.good { background: #e6f6ec; color: #145c33; }
.feedback.bad { background: #fdeeec; color: #7d1d15; }
.feedback.neutral { background: var(--surface-2); }
.tips { margin-top: 4px; }
.check { margin-top: 12px; padding: 12px 16px; border-radius: 10px; border: 1px solid; }
.check.good { background: #e8f7ee; border-color: #a9dcbd; }
.check.bad { background: #fff4f2; border-color: #f1c4be; }
.tests { list-style: none; padding: 0; margin: 8px 0 4px; display: flex; flex-direction: column; gap: 6px; }
.tests li.pass { color: var(--success); font-weight: 600; }
.tests li.fail { color: #8b2017; font-weight: 600; }
.diff { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 6px 0 4px; font-weight: 400; color: var(--text); }
.diff pre { margin: 2px 0 0; background: #fff; border: 1px solid var(--line); padding: 8px 10px; border-radius: 6px; font-family: var(--mono); font-size: 12.5px; overflow-x: auto; max-height: 260px; }
.diff pre .dl { background: #fde2df; display: inline-block; min-width: 100%; }
.dh { font-size: .76rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; }
.solution { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.solution .static-code { width: 100%; }
.pg-bar { margin: 12px 0; }
.pg-bar select { font: inherit; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); max-width: 100%; }

/* ---------- Responsiv ---------- */
@media (max-width: 900px) {
  .menu-btn { display: block; }
  .topnav { display: none; }
  .total-progress .bar { width: 70px; }
  .sidebar { position: fixed; top: 56px; left: 0; bottom: 0; height: auto; z-index: 30; transform: translateX(-100%); transition: transform .2s; box-shadow: 4px 0 20px rgba(0,0,0,.15); }
  body.nav-open .sidebar { transform: none; }
  .compare, .diff { grid-template-columns: 1fr; }
  main { padding-top: 18px; }
}
@media (max-width: 520px) {
  .brand { font-size: 1rem; }
  .card { padding: 14px 12px; }
  .toolbar .extra { margin-left: 0; }
}

</style>
</head>
<body>
  <header class="topbar">
    <button id="menu-btn" class="menu-btn" type="button" aria-label="Kapitelmenü">☰</button>
    <a class="brand" href="#/"><span class="logo">PL/I</span> Lernpfad</a>
    <nav class="topnav">
      <a href="#/">Kapitel</a>
      <a href="#/spielwiese">Spielwiese</a>
      <a href="#/referenz">Kurzreferenz</a>
      <a href="#/ueber">Über</a>
    </nav>
    <div id="total-progress" class="total-progress" title="Gesamtfortschritt"></div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <div class="side-h">Kapitel</div>
      <nav id="chapters"></nav>
      <div class="side-links">
        <a href="#/spielwiese">▶ Spielwiese</a>
        <a href="#/referenz">📖 Kurzreferenz</a>
      </div>
    </aside>
    <main id="main" tabindex="-1">
      <noscript><p>Diese Seite braucht JavaScript – der PL/I-Interpreter läuft direkt im Browser.</p></noscript>
    </main>
  </div>

  <!-- PL/I-Interpreter -->
  <script>
/* js/pli/core.js */
/* PL/I-Lernumgebung – Kern: Hilfsfunktionen, Werte, EBCDIC, PICTURE */
(function (G) {
  'use strict';
  const PLI = (G.PLI = G.PLI || {});

  class CompileError extends Error {
    constructor(msg, line, col) {
      super(msg);
      this.line = line;
      this.col = col;
    }
  }
  PLI.CompileError = CompileError;

  // ---------------- BigInt-Helfer ----------------
  const P10 = [1n];
  for (let i = 1; i <= 90; i++) P10.push(P10[i - 1] * 10n);
  const pow10 = (n) => (n <= 90 ? P10[n] : 10n ** BigInt(n));
  const P2 = [1n];

      if (!(op.t === 'op' && (op.v === '=' || COMPOUND.has(op.v)))) {
        if (first.t === 'id' && !KNOWN_STMTS.has(first.u) && targets.length === 1 && targets[0].parts.length === 1) {
          if (JAVA_WORDS[first.u]) this.fail(`"${first.raw}" ist keine PL/I-Anweisung. ${JAVA_WORDS[first.u]}`, first);
          this.fail(
            `Unbekannte Anweisung "${first.raw}" (oder bei einer Zuweisung fehlt das "="). Prozeduren ruft man mit CALL ${first.raw}(...); auf.`,
            first
          );
        }
        this.fail(`Erwartet "=" in der Zuweisung, gefunden ${this.desc(op)}.`);
      }
      this.next();
      const expr = this.parseExpr();
      let byName = false;
      if (this.isOp(',') && this.isKw('BY', this.peek())) {
        this.next();
        this.next();
        this.expectKw('NAME', 'nach BY');
        byName = true;
      }
      this.expectSemi();
      return { type: 'assign', targets, op: op.v, expr, byName, line: first.line, col: first.col };
    }

    // ---------------- Referenzen & Ausdrücke ----------------
    parseRefBasic() {
      const t = this.t;
      if (t.t !== 'id') this.fail(`Name erwartet, gefunden ${this.desc(t)}.`);
      const parts = [];
      for (;;) {
        const n = this.next();
        let args = null;
        if (this.isOp('(')) args = this.parseArgs();
        parts.push({ name: n.u, raw: n.raw, args, line: n.line, col: n.col });
        if (this.isOp('.') && this.peek().t === 'id') {
          this.next();
          continue;
        }
        break;
      }
      return { type: 'ref', parts, ptr: null, line: t.line, col: t.col };
    }
    parseRef() {
      let r = this.parseRefBasic();
      while (this.isOp('->')) {
        this.next();
        const r2 = this.parseRefBasic();
        r2.ptr = r;
        r = r2;
      }
      return r;
    }
    parseArgs() {
      this.expectOp('(');
      const args = [];
      if (this.acceptOp(')')) return args;
      do {
        if (this.isOp('*') && (this.isOp(',', this.peek()) || this.isOp(')', this.peek()))) {
          const st = this.next();
          args.push({ type: 'star', line: st.line, col: st.col });
        } else args.push(this.parseExpr());
      } while (this.acceptOp(','));
      this.expectOp(')', 'am Ende der Argumentliste');
      return args;
    }
    parseExpr() {
      return this.parseOr();
    }
    parseOr() {
      let l = this.parseAnd();
      while (this.isOp('|') || this.isOp('!')) {
        const op = this.next();
        l = { type: 'bin', op: '|', l, r: this.parseAnd(), line: op.line, col: op.col };
      }
      return l;
    }
    parseAnd() {
      let l = this.parseCmp();
      while (this.isOp('&')) {
        const op = this.next();
        l = { type: 'bin', op: '&', l, r: this.parseCmp(), line: op.line, col: op.col };
      }
      return l;
    }
    parseCmp() {
      let l = this.parseCat();
      const map = { '=': '=', '¬=': 'NE', '^=': 'NE', '<>': 'NE', '<': '<', '>': '>', '<=': '<=', '>=': '>=', '¬<': '>=', '^<': '>=', '¬>': '<=', '^>': '<=' };
      while (this.t.t === 'op' && map[this.t.v]) {
        const op = this.next();
        l = { type: 'bin', op: map[op.v], l, r: this.parseCat(), line: op.line, col: op.col };
      }
      return l;
    }
    parseCat() {
      let l = this.parseAdd();
      while (this.isOp('||') || this.isOp('!!')) {
        const op = this.next();
        l = { type: 'bin', op: '||', l, r: this.parseAdd(), line: op.line, col: op.col };
      }
      return l;
    }
    parseAdd() {
      let l = this.parseMul();
      while (this.isOp('+') || this.isOp('-')) {
        const op = this.next();
        l = { type: 'bin', op: op.v, l, r: this.parseMul(), line: op.line, col: op.col };
      }
      return l;
    }
    parseMul() {
      let l = this.parseUnary();
      while (this.isOp('*') || this.isOp('/')) {
        const op = this.next();
        l = { type: 'bin', op: op.v, l, r: this.parseUnary(), line: op.line, col: op.col };
      }
      return l;
    }
    parseUnary() {
      if (this.isOp('+') || this.isOp('-') || this.isOp('¬') || this.isOp('^')) {
        const op = this.next();
        const e = this.parseUnary();
        return { type: 'un', op: op.v === '^' ? '¬' : op.v, e, line: op.line, col: op.col };
      }
      return this.parsePow();
    }
    parsePow() {
      const b = this.parsePrimary();
      if (this.isOp('**')) {
        const op = this.next();
        return { type: 'bin', op: '**', l: b, r: this.parseUnary(), line: op.line, col: op.col };
      }
      return b;
    }
    parsePrimary() {
      const t = this.t;
      if (t.t === 'num') {
        this.next();
        return { type: 'num', text: t.text, bin: !!t.bin, line: t.line, col: t.col };
      }
      if (t.t === 'str') {
        this.next();
        return { type: 'str', v: t.v, line: t.line, col: t.col };
      }
      if (t.t === 'bit') {
        this.next();
        return { type: 'bitc', v: t.v, line: t.line, col: t.col };
      }
      if (this.isOp('(')) {
        this.next();
        const e = this.parseExpr();
        this.expectOp(')', 'zum Schließen der Klammer');
        if ((this.t.t === 'str' || this.t.t === 'bit') && e.type === 'num' && /^\d+$/.test(e.text)) {
          // Wiederholungsfaktor: (5)'-' = '-----'
          const s = this.next();
          const n = parseInt(e.text, 10);
          return { type: s.t === 'str' ? 'str' : 'bitc', v: s.v.repeat(n), line: t.line, col: t.col };
        }
        return { type: 'paren', e, line: t.line, col: t.col };
      }
      if (t.t === 'id') {
        if (['THEN', 'ELSE', 'DO', 'END', 'TO', 'BY'].includes(t.u))
          this.fail(`Ausdruck erwartet, gefunden Schlüsselwort ${t.u}.`);
        return this.parseRef();
      }
      if (t.t === 'eof') this.fail('Unerwartetes Programmende – Ausdruck erwartet.');
      this.fail(`Ausdruck erwartet, gefunden ${this.desc(t)}.`);
    }

    // ---------------- Blöcke ----------------
    parseProc(base) {
      const pt = this.next();
      if (!base.labels.length) this.fail('Eine Prozedur braucht einen Namen: NAME: PROCEDURE;', pt);
      const node = { type: 'proc', name: base.labels[0], params: [], main: false, returns: null, recursive: false, options: [] };
      try {
        if (this.isOp('(')) {
          this.next();
          if (!this.acceptOp(')')) {
            do {
              const id = this.expectId('(Parametername)');
              node.params.push({ name: id.u, line: id.line, col: id.col });
            } while (this.acceptOp(','));
            this.expectOp(')', 'nach der Parameterliste');
          }
        }
        while (this.t.t === 'id' && !this.newLineStmt()) {
          const k = this.next();
          switch (k.u) {
            case 'OPTIONS':
              this.expectOp('(');
              while (!this.isOp(')') && this.t.t !== 'eof') {
                const o = this.next();
                if (o.t === 'id') {
                  node.options.push(o.u);
                  if (o.u === 'MAIN') node.main = true;
                }
                if (this.isOp('(')) this.skipParens();
                this.acceptOp(',');
              }
              this.expectOp(')');
              break;
            case 'RETURNS':
              this.expectOp('(');
              node.returns = this.parseAttributes();
              node.returnsTok = k;
              this.expectOp(')');
              break;
            case 'RECURSIVE':
              node.recursive = true;
              break;
            case 'REORDER':
            case 'ORDER':
            case 'REENTRANT':
            case 'NONRECURSIVE':
              break;
            case 'EXTERNAL':
            case 'EXT':
              if (this.isOp('(')) this.skipParens();
              break;
            default:
              this.fail(`Unbekannte Option "${k.raw}" in der PROCEDURE-Anweisung.`, k);
          }
        }
        this.expectSemi();
      } catch (e) {
        this.record(e);
        this.recover();
      }
      const r = this.parseBody({ kind: 'PROCEDURE ' + node.name, labels: base.labels, line: pt.line, col: pt.col });
      node.body = r.body;
      node.endLine = r.endLine;
      return node;
    }
    parsePackage(base) {
      const pt = this.next();
      while (!this.isOp(';') && this.t.t !== 'eof') this.next();
      this.expectSemi();
      const r = this.parseBody({ kind: 'PACKAGE', labels: base.labels, line: pt.line, col: pt.col });
      return { type: 'package', name: base.labels[0] || 'PACKAGE', body: r.body, endLine: r.endLine };
    }
    parseBegin(base) {
      const bt = this.next();
      while (this.acceptKw('ORDER', 'REORDER')) {}
      try {
        this.expectSemi();
      } catch (e) {
        this.record(e);
        this.recover();
      }
      const r = this.parseBody({ kind: 'BEGIN-Block', labels: base.labels, line: bt.line, col: bt.col });
      return { type: 'begin', body: r.body, endLine: r.endLine };
    }
    skipParens() {
      let d = 0;
      do {
        if (this.isOp('(')) d++;
        else if (this.isOp(')')) d--;
        if (this.t.t === 'eof') this.fail('Klammer wird nicht geschlossen.');
        this.next();
      } while (d > 0);
    }

    // ---------------- DECLARE ----------------
    parseDeclare() {
      const kw = this.next();
      const items = [];
      do {
        items.push(...this.parseDclItem());
      } while (this.acceptOp(','));
      this.expectSemi();
      return { type: 'dcl', items, line: kw.line };
    }
    parseDclItem() {
      let level = null;
      if (this.t.t === 'num' && /^\d+$/.test(this.t.text)) {
        level = parseInt(this.next().text, 10);
      }
      if (this.isOp('(')) {
        const ft = this.next();
        const inner = [];
        do {
          inner.push(...this.parseDclItem());
        } while (this.acceptOp(','));
        this.expectOp(')', 'am Ende der Faktorisierung');
        let dims = null;
        if (this.isOp('(')) dims = this.parseDims();
        const attrs = this.parseAttributes();
        for (const it of inner) {
          if (level != null && it.level == null) it.level = level;
          if (dims && !it.dims) it.dims = dims;
          for (const k of Object.keys(attrs)) if (it.attrs[k] === undefined) it.attrs[k] = attrs[k];
        }
        return inner;
      }
      const name = this.expectId('in der Deklaration');
      if (KNOWN_STMTS.has(name.u) && ['IF', 'DO', 'END', 'PUT', 'GET', 'CALL', 'RETURN'].includes(name.u))
        this.diag('W', `"${name.raw}" ist ein PL/I-Schlüsselwort – als Variablenname besser vermeiden.`, name);
      let dims = null;
      if (this.isOp('(')) dims = this.parseDims();
      const attrs = this.parseAttributes();
      return [{ level, name: name.u, raw: name.raw, dims, attrs, line: name.line, col: name.col }];
    }
    parseDims() {
      this.expectOp('(');
      const dims = [];
      do {
        if (this.isOp('*')) {
          this.next();
          dims.push({ star: true });
        } else {
          const a = this.parseExpr();
          if (this.acceptOp(':')) {
            const b = this.parseExpr();
            dims.push({ lo: a, hi: b });
          } else dims.push({ lo: null, hi: a });
        }
      } while (this.acceptOp(','));
      this.expectOp(')', 'am Ende der Dimensionsangabe');
      return dims;
    }
    precOpt(a, required) {
      if (this.isOp('(')) {
        this.next();
        const p = this.t;
        if (p.t !== 'num' || !/^\d+$/.test(p.text)) this.fail('Genauigkeit muss eine ganze Zahl sein, z.B. FIXED DEC(7,2).');
        this.next();
        a.p = parseInt(p.text, 10);
        if (this.acceptOp(',')) {
          let neg = !!this.acceptOp('-');
          if (!neg) this.acceptOp('+');
          const q = this.t;
          if (q.t !== 'num' || !/^\d+$/.test(q.text)) this.fail('Skalierungsfaktor muss eine ganze Zahl sein.');
          this.next();
          a.q = (neg ? -1 : 1) * parseInt(q.text, 10);
        }
        this.expectOp(')');
      } else if (required) this.fail('Genauigkeit erwartet.');
    }
    lenOpt() {
      if (!this.isOp('(')) return null;
      this.next();
      let len;
      if (this.isOp('*')) {
        this.next();
        len = { star: true };
      } else len = this.parseExpr();
      if (this.isKw('REFER')) this.fail('REFER wird nicht unterstützt.');
      this.expectOp(')');
      return len;
    }
    parenExpr(ctx) {
      this.expectOp('(', ctx);
      const e = this.parseExpr();
      this.expectOp(')');
      return e;
    }
    parseAttributes() {
      const a = {};
      while (this.t.t === 'id') {
        const k = this.next();
        const u = k.u;
        switch (u) {
          case 'FIXED':
            a.scale = 'FIXED';
            this.precOpt(a);
            break;
          case 'FLOAT':
            a.scale = 'FLOAT';
            this.precOpt(a);
            break;
          case 'DECIMAL':
          case 'DEC':
            a.base = 'DEC';
            this.precOpt(a);
            break;
          case 'BINARY':
          case 'BIN':
            a.base = 'BIN';
            this.precOpt(a);
            break;
          case 'PRECISION':
          case 'PREC':
            this.precOpt(a, true);
            break;
          case 'REAL':
            break;
          case 'COMPLEX':
          case 'CPLX':
            this.fail('Komplexe Zahlen (COMPLEX) werden in der Lernumgebung nicht unterstützt.', k);
            break;
          case 'CHARACTER':
          case 'CHAR':
            a.str = 'C';
            a.len = this.lenOpt();
            break;
          case 'BIT':
            a.str = 'B';
            a.len = this.lenOpt();
            break;
          case 'GRAPHIC':
          case 'WIDECHAR':
          case 'WCHAR':
          case 'UCHAR':
            this.fail(`${u} wird in der Lernumgebung nicht unterstützt.`, k);
            break;
          case 'VARYING':
          case 'VAR':
          case 'VARYINGZ':
          case 'VARZ':
            a.varying = true;
            break;
          case 'NONVARYING':
          case 'NONVAR':
            a.varying = false;
            break;
          case 'PICTURE':
          case 'PIC':
            if (this.t.t !== 'str') this.fail("Nach PIC muss eine Zeichenkette stehen, z.B. PIC '9999V99'.");
            a.pic = this.next().v;
            a.picTok = k;
            break;
          case 'POINTER':
          case 'PTR':
            a.ptr = true;
            break;
          case 'OFFSET':
          case 'HANDLE':
          case 'AREA':
          case 'ORDINAL':
            this.fail(`${u} wird in der Lernumgebung nicht unterstützt.`, k);
            break;
          case 'STATIC':
            a.storage = 'STATIC';
            break;
          case 'AUTOMATIC':
          case 'AUTO':
            a.storage = 'AUTO';
            break;
          case 'BASED':
            a.storage = 'BASED';
            if (this.isOp('(')) a.basedPtr = this.parenExpr();
            break;
          case 'CONTROLLED':
          case 'CTL':
            a.storage = 'CTL';
            break;
          case 'DEFINED':
          case 'DEF':
            if (this.isOp('(')) {
              this.next();
              a.defined = this.parseRef();
              this.expectOp(')');
            } else a.defined = this.parseRef();
            a.defTok = k;
            break;
          case 'POSITION':
          case 'POS':
            a.position = this.parenExpr();
            break;
          case 'INITIAL':
          case 'INIT':
            if (this.isKw('CALL') || this.isKw('TO')) this.fail('INIT CALL / INIT TO wird nicht unterstützt.');
            a.init = this.parseInitList();
            break;
          case 'VALUE':
            a.value = this.parenExpr();
            break;
          case 'LIKE':
            a.like = this.parseRef();
            break;
          case 'DIMENSION':
          case 'DIM':
            a.dims = this.parseDims();
            break;
          case 'FILE':
            a.file = true;
            break;
          case 'RECORD':
          case 'STREAM':
          case 'INPUT':
          case 'OUTPUT':
          case 'UPDATE':
          case 'PRINT':
            a['f_' + u] = true;
            break;
          case 'SEQUENTIAL':
          case 'SEQL':
          case 'KEYED':
          case 'DIRECT':
          case 'BUFFERED':
          case 'UNBUFFERED':
          case 'BUF':
          case 'UNBUF':
            break;
          case 'ENVIRONMENT':
          case 'ENV':
            if (this.isOp('(')) this.skipParens();
            break;
          case 'EXTERNAL':
          case 'EXT':
            a.external = true;
            if (this.isOp('(')) this.skipParens();
            break;
          case 'INTERNAL':
          case 'INT':
            a.internal = true;
            break;
          case 'ENTRY':
            a.entry = true;
            if (this.isOp('(')) this.skipParens();
            break;
          case 'RETURNS':
            this.expectOp('(');
            a.returns = this.parseAttributes();
            this.expectOp(')');
            break;
          case 'OPTIONS':
            if (this.isOp('(')) this.skipParens();
            break;
          case 'BUILTIN':
            a.builtin = true;
            break;
          case 'CONDITION':
          case 'COND':
            a.condition = true;
            break;
          case 'LABEL':
            a.label = true;
            if (this.isOp('(')) this.skipParens();
            break;
          case 'ALIGNED':
          case 'UNALIGNED':
          case 'UNAL':
          case 'NORMAL':
          case 'ABNORMAL':
          case 'CONNECTED':
          case 'NONCONNECTED':
          case 'ASSIGNABLE':
          case 'NONASSIGNABLE':
          case 'NONASGN':
          case 'BYADDR':
          case 'BYVALUE':
          case 'OPTIONAL':
          case 'INONLY':
          case 'INOUT':
          case 'OUTONLY':
          case 'SIGNED':
          case 'UNSIGNED':
          case 'HEXADEC':
          case 'IEEE':
          case 'BIGENDIAN':
          case 'LITTLEENDIAN':
          case 'NATIVE':
          case 'NONNATIVE':
          case 'IRREDUCIBLE':
          case 'REDUCIBLE':
            break;
          case 'DATE':
            if (this.isOp('(')) this.skipParens();
            break;
          default: {
            this.i--;
            const pv = this.toks[this.i - 1];
            if (pv && k.line > pv.line) return a; // vermutlich fehlt ; – meldet expectSemi
            this.fail(`Unbekanntes Attribut "${k.raw}". Fehlt vielleicht ein Komma zwischen zwei Deklarationen?`);
          }
        }
      }
      return a;
    }
    parseInitList() {
      this.expectOp('(', 'nach INIT');
      const items = this.parseInitItems();
      this.expectOp(')', 'am Ende der INIT-Liste');
      return items;
    }
    parseInitItems() {
      const items = [];
      do {
        items.push(this.parseInitItem());
      } while (this.acceptOp(','));
      return items;
    }
    startsItem(t = this.t) {
      return t.t === 'num' || t.t === 'str' || t.t === 'bit' || t.t === 'id' || (t.t === 'op' && ['(', '-', '+'].includes(t.v));
    }
    parseInitItem() {
      if (this.isOp('(')) {
        const save = this.i;
        this.next();
        if (this.isOp('*') && this.isOp(')', this.peek())) {
          this.next();
          this.next();
          return { rep: 'star', item: this.parseInitAfterFactor() };
        }
        const e = this.parseExpr();
        if (this.acceptOp(')')) {
          if (this.startsItem()) return { rep: e, item: this.parseInitAfterFactor() };
          return { value: { type: 'paren', e, line: e.line, col: e.col } };
        }
        this.i = save;
        this.fail('Ungültige INIT-Angabe.');
      }
      return { value: this.parseExpr() };
    }
    parseInitAfterFactor() {
      if (this.isOp('(')) {
        const save = this.i;
        this.next();
        const items = this.parseInitItems();
        this.expectOp(')');
        if (items.length === 1 && items[0].value && this.startsItem() && !this.isOp(',') ) {
          // verschachtelter Faktor (n)(m)x
          return { rep: items[0].value, item: this.parseInitAfterFactor() };
        }
        return { list: items };
      }
      return { value: this.parseExpr() };
    }

    // ---------------- IF / DO / SELECT ----------------
    parseUnit(ctx) {
      const t = this.t;
      if (this.isKw('END') && !this.looksAssign()) this.fail(`Nach ${ctx} fehlt eine Anweisung.`);
      if ((this.isKw('DCL') || this.isKw('DECLARE')) && !this.looksAssign())
        this.fail(`DECLARE darf nicht direkt nach ${ctx} stehen.`);
      if (t.t === 'eof') this.fail(`Nach ${ctx} fehlt eine Anweisung.`);
      const st = this.parseStatement(false);
      if (st && (st.type === 'proc')) this.fail(`Nach ${ctx} darf keine PROCEDURE stehen.`, t);
      return st || { type: 'null', line: t.line, col: t.col, labels: [] };
    }
    parseIf() {
      const it = this.next();
      const cond = this.parseExpr();
      if (!this.acceptKw('THEN')) {
        if (this.isOp('{')) this.fail('In PL/I gibt es keine geschweiften Klammern. Schreibe: IF bedingung THEN DO; ... END;');
        this.fail(`Erwartet THEN nach der IF-Bedingung, gefunden ${this.desc(this.t)}.`);
      }
      const then = this.parseUnit('THEN');
      let els = null;
      if (this.isKw('ELSE') && !this.looksAssign()) {
        this.next();
        els = this.parseUnit('ELSE');
      }
      return { type: 'if', cond, then, els, line: it.line, col: it.col };
    }
    parseDo(base) {
      const dt = this.next();
      const node = { type: 'do', kind: 'group' };
      try {
        if (this.isOp(';')) {
          this.next();
        } else if ((this.isKw('WHILE') || this.isKw('UNTIL')) && this.isOp('(', this.peek())) {
          node.kind = 'while';
          this.parseWhileUntil(node);
          this.expectSemi();
        } else if ((this.isKw('FOREVER') || this.isKw('LOOP')) && this.isOp(';', this.peek())) {
          this.next();
          node.kind = 'forever';
          this.expectSemi();
        } else {
          node.kind = 'iter';
          if (this.t.t !== 'id') this.fail('Nach DO erwartet: ";", WHILE(...), UNTIL(...) oder eine Zählvariable (DO I = 1 TO N;).');
          node.ctrl = this.parseRef();
          if (!this.isOp('=')) this.fail(`Erwartet "=" nach der Laufvariablen (z.B. DO I = 1 TO 10;), gefunden ${this.desc(this.t)}.`);
          this.next();
          node.specs = [];
          do {
            node.specs.push(this.parseDoSpec());
          } while (this.acceptOp(','));
          this.expectSemi();
        }
      } catch (e) {
        this.record(e);

          if (d.kind === 'file') d.storage = 'STATIC';
        } else {
          if (a.storage) this.err(`Speicherklasse ${a.storage} darf nur auf Stufe 1 stehen (bei ${d.raw}).`, d);
          if (a.value !== undefined) this.err('VALUE ist nur für Stufe-1-Variablen erlaubt.', d);
          d.storage = root.storage;
        }
        d.type = this.computeType(d);
        d.ndims = d.dims ? d.dims.length : 0;
        for (const c of d.children) walk(c, root);
      };
      for (const r of block.roots) walk(r, r);
      for (const r of block.roots) {
        if (r.kind !== 'var') continue;
        if (r.storage === 'AUTO' || r.storage === 'PARAM' || r.storage === 'DEFINED') {
          r.slot = block.slotCount++;
          block.autoDecls.push(r);
        } else if (r.storage === 'STATIC') block.staticDecls.push(r);
        if (r.storage === 'CTL') r.ctl = [];
      }
    }

    computeType(d) {
      const a = d.attrs;
      if (d.children.length) {
        if (a.scale || a.base || a.str || a.pic || a.ptr)
          this.err(`${d.raw} hat Unterelemente (ist eine Struktur) und darf keinen eigenen Datentyp haben.`, d);
        return { k: 'S' };
      }
      if (a.file || a.entry || a.builtin || a.condition || a.label) return { k: 'X' };
      let n = 0;
      if (a.pic) n++;
      if (a.ptr) n++;
      if (a.str) n++;
      if (a.scale || a.base) n++;
      if (n > 1) this.err(`${d.raw} hat widersprüchliche Datentypen.`, d);
      if (a.pic) {
        try {
          const pic = PLI.parsePicture(a.pic);
          if (pic.isChar) return { k: 'C', lenConst: pic.len, vy: false, charPic: pic };
          if (pic.p > this.maxDec) this.maxDec = pic.p;
          return { k: 'PIC', pic, p: pic.p, q: pic.q };
        } catch (e) {
          this.err(`Fehler in PICTURE '${a.pic}': ${e.message}`, a.picTok || d);
          return { k: 'C', lenConst: 1 };
        }
      }
      if (a.ptr) return { k: 'P' };
      if (a.str) {
        if (a.len && a.len.star && !d.isParam && !(d.root && d.root.isParam))
          this.err('CHAR(*) ist nur bei Parametern erlaubt.', d);
        return { k: a.str, lenExpr: a.len, vy: !!a.varying };
      }
      if (a.varying) this.err('VARYING ist nur bei CHAR oder BIT erlaubt.', d);
      if (a.scale || a.base || a.p != null) {
        const scale = a.scale || 'FLOAT';
        const base = a.base || 'DEC';
        if (!a.scale && a.base === 'BIN' && !d.implicit)
          this.info(`${d.raw}: BINARY ohne FIXED bedeutet FLOAT BINARY(21) – meintest du FIXED BIN?`, d);
        if (!a.scale && a.base === 'DEC')
          this.info(`${d.raw}: DECIMAL ohne FIXED bedeutet FLOAT DECIMAL(6) – meintest du FIXED DEC?`, d);
        if (scale === 'FIXED') {
          const b = base === 'DEC' ? 'D' : 'B';
          const p = a.p != null ? a.p : b === 'D' ? 5 : 15;
          const q = a.q != null ? a.q : 0;
          if (b === 'D' && p > 31) this.err(`FIXED DECIMAL erlaubt höchstens 31 Stellen (hier ${p}).`, d);
          if (b === 'B' && p > 63) this.err(`FIXED BINARY erlaubt höchstens 63 Bit (hier ${p}).`, d);
          if (p < 1) this.err('Die Genauigkeit muss mindestens 1 sein.', d);
          if (q < 0 || q > p) this.err(`Skalierungsfaktor ${q} muss zwischen 0 und ${p} liegen.`, d);
          if (b === 'B' && q !== 0) this.err('FIXED BINARY mit Nachkommastellen wird in der Lernumgebung nicht unterstützt.', d);
          if (b === 'D' && p > this.maxDec) this.maxDec = p;
          if (b === 'B' && p > this.maxBin) this.maxBin = p;
          return { k: 'F', b, p: Math.min(p, b === 'D' ? 31 : 63), q: Math.max(0, Math.min(q, p)) };
        }
        const b = base === 'DEC' ? 'D' : 'B';
        const p = a.p != null ? a.p : b === 'D' ? 6 : 21;
        if (a.q != null) this.err('FLOAT hat keinen Skalierungsfaktor.', d);
        return { k: 'E', b, p };
      }
      const t = defaultTypeFor(d.name);
      if (!d.implicit && d.kind === 'var' && !d.isParam)
        this.info(`${d.raw} hat keinen Datentyp – PL/I nimmt den Standard ${PLI.typeName(t)} (Regel nach dem Anfangsbuchstaben).`, d);
      return t;
    }

    // ---------------- Namensauflösung ----------------
    qualMatches(d, quals) {
      let anc = d.parent;
      for (let i = quals.length - 1; i >= 0; i--) {
        while (anc && anc.name !== quals[i]) anc = anc.parent;
        if (!anc) return false;
        anc = anc.parent;
      }
      return true;
    }
    pathOf(d) {
      const p = [];
      for (let x = d; x; x = x.parent) p.unshift(x);
      return p;
    }
    lookupVar(parts, block, node) {
      const last = parts[parts.length - 1].name;
      const quals = parts.slice(0, -1).map((p) => p.name);
      for (let b = block; b; b = b.parent) {
        const cands = (b.names.get(last) || []).filter((d) => this.qualMatches(d, quals));
        if (cands.length === 1) return cands[0];
        if (cands.length > 1) {
          const exact = cands.filter((d) => this.pathOf(d).length === parts.length);
          if (exact.length === 1) return exact[0];
          const roots = cands.filter((d) => !d.parent);
          if (roots.length === 1) return roots[0];
          this.err(
            `Mehrdeutiger Name ${parts.map((p) => p.raw).join('.')} – er kommt in mehreren Strukturen vor. Qualifiziere ihn, z.B. ${cands[0].parent ? cands[0].parent.raw + '.' : ''}${cands[0].raw}.`,
            node
          );
          return cands[0];
        }
        if (parts.length === 1 && b.procs.has(last)) return null;
      }
      return null;
    }
    lookupProc(name, block) {
      for (let b = block; b; b = b.parent) {
        if ((b.names.get(name) || []).some((d) => !d.parent && d.kind !== 'entry')) return null;
        if (b.procs.has(name)) return b.procs.get(name);
      }
      return null;
    }
    outerProcBlock(block) {
      let b = block;
      while (b.parent && b.parent.kind !== 'root' && b.parent.kind !== 'package') b = b.parent;
      return b;
    }
    implicitDecl(name, raw, block, node) {
      const ob = this.outerProcBlock(block);
      const d = this.newDecl({ name, raw, attrs: {}, line: node.line, col: node.col }, ob);
      d.implicit = true;
      d.root = d;
      d.storage = ob.kind === 'root' ? 'STATIC' : 'AUTO';
      d.type = defaultTypeFor(name);
      d.ndims = 0;
      ob.roots.push(d);
      this.addName(ob, d);
      if (d.storage === 'AUTO') {
        d.slot = ob.slotCount++;
        ob.autoDecls.push(d);
      } else ob.staticDecls.push(d);
      this.warn(
        `${raw} ist nicht deklariert. PL/I legt die Variable automatisch als ${PLI.typeName(d.type)} an (Anfangsbuchstabe ${/^[I-N]/.test(name) ? 'I–N → FIXED BIN(15)' : 'nicht I–N → FLOAT DEC(6)'}). Besser: DCL ${raw} ...;`,
        node
      );
      return d;
    }

    // ctx: {target, callee, file, cond}
    resolveRef(ref, block, ctx = {}) {
      if (ref.res) return ref.res;
      if (ref.ptr) this.resolveExpr(ref.ptr, block);
      const parts = ref.parts;
      const first = parts[0];
      const last = parts[parts.length - 1];
      let d = this.lookupVar(parts, block, ref);
      let res = null;
      if (d) {
        if (d.kind === 'file') res = { kind: 'file', decl: d };
        else if (d.kind === 'cond') res = { kind: 'cond', decl: d };
        else if (d.kind === 'builtin') {
          if (!PLI.BUILTINS[d.name]) this.err(`${d.raw} ist keine eingebaute Funktion.`, ref);
          res = { kind: 'builtin', name: d.name, def: PLI.BUILTINS[d.name] };
        } else if (d.kind === 'entry') {
          const pb = this.lookupProcAny(d.name, block);
          res = pb ? { kind: 'proc', block: pb } : { kind: 'entryExt', decl: d };
        } else {
          const path = this.pathOf(d);
          res = { kind: 'var', decl: d, root: d.root, path };
          let total = 0;
          for (const x of path) total += x.ndims;
          let given = 0;
          for (const p of parts) if (p.args) given += p.args.length;
          if (given > 0 && given !== total && !(given < total && this.prefixSubsOk(path, given))) {
            if (total === 0)
              this.err(`${d.raw} ist kein Array – Indizes sind hier nicht erlaubt.${d.type && d.type.k === 'C' ? ' Für Teilzeichenketten verwende SUBSTR(' + d.raw + ', pos, länge).' : ''}`, first);
            else this.err(`Falsche Anzahl Indizes für ${d.raw}: erwartet ${total}, angegeben ${given}.`, first);
          }
          ref.subTotal = total;
          for (const p of parts) if (p.args) for (const a of p.args) if (a.type !== 'star') this.resolveExpr(a, block);
          if (d.root.storage === 'BASED' && !ref.ptr && !d.root.attrs.basedPtr && !ctx.alloc)
            this.err(`${d.root.raw} ist BASED ohne Zeiger – verwende P->${d.root.raw} oder deklariere BASED(P).`, ref);
          if (ref.ptr && d.root.storage !== 'BASED')
            this.err(`Der Zeiger-Operator -> ist nur bei BASED-Variablen erlaubt (${d.root.raw} ist nicht BASED).`, ref);
          if (ctx.target && d.root.isConst) this.err(`${d.raw} ist eine Konstante (VALUE) und kann nicht verändert werden.`, ref);
        }
      } else {
        const pb = parts.length === 1 ? this.lookupProc(first.name, block) : null;
        if (pb) {
          res = { kind: 'proc', block: pb };
          const args = first.args || [];
          for (const a of args) this.resolveExpr(a, block);
          if (!ctx.callee) {
            if (!pb.node.returns)
              this.warn(
                `Prozedur ${pb.name} wird als Funktion verwendet, hat aber kein RETURNS(...). Der Rückgabetyp ist dann ${PLI.typeName(defaultTypeFor(pb.name))}.`,
                ref
              );
            if (first.args == null && pb.node.params.length === 0)
              this.info(`Funktionsaufruf ohne Klammern – schreibe besser ${first.raw}().`, ref);
          }
          if (args.length !== pb.node.params.length)
            this.err(`${pb.name} erwartet ${pb.node.params.length} Argument(e), angegeben ${args.length}.`, ref);
        } else if (parts.length === 1 && PLI.BUILTINS[first.name]) {
          const def = PLI.BUILTINS[first.name];
          res = { kind: 'builtin', name: first.name, def };
          if (ctx.target && !def.pseudo)
            this.err(`${first.raw} ist eine eingebaute Funktion. Wenn du eine Variable meinst, deklariere sie: DCL ${first.raw} ...;`, ref);
        } else if (ctx.file) {
          this.err(`Datei ${first.raw} ist nicht deklariert. Schreibe z.B. DCL ${first.raw} FILE RECORD INPUT;`, ref);
          res = { kind: 'file', decl: null };
        } else if (parts.length === 1 && !first.args && !ctx.callee) {
          if (this.findLabel(first.name, block)) {
            this.err(`${first.raw} ist ein Label und kann hier nicht verwendet werden.`, ref);
            res = { kind: 'err' };
          } else {
            d = this.implicitDecl(first.name, first.raw, block, ref);
            res = { kind: 'var', decl: d, root: d, path: [d] };
            ref.subTotal = 0;
          }
        } else {
          if (ctx.callee) this.err(`Prozedur ${first.raw} nicht gefunden.`, ref);
          else if (parts.length > 1)
            this.err(`Strukturelement ${parts.map((p) => p.raw).join('.')} nicht gefunden.`, ref);
          else this.err(`Unbekannte Funktion oder Array "${first.raw}" – ist ${first.raw} deklariert?`, ref);
          res = { kind: 'err' };
          for (const p of parts) if (p.args) for (const a of p.args) if (a.type !== 'star') this.resolveExpr(a, block);
        }
      }
      if (res.kind === 'builtin') {
        const def = res.def;
        const args = first.args || [];
        if (parts.length > 1) this.err(`${first.raw} ist eine eingebaute Funktion und hat keine Elemente.`, ref);
        if (def) {
          if (args.length < def.min || args.length > def.max)
            this.err(
              `${first.raw} erwartet ${def.min === def.max ? def.min : def.min + ' bis ' + def.max} Argument(e), angegeben ${args.length}.`,
              ref
            );
          if (first.args == null && def.min > 0) this.err(`${first.raw} braucht Argumente in Klammern.`, ref);
          for (const a of args) if (a.type !== 'star') this.resolveExpr(a, block);
        }
      }
      if (res.kind === 'proc' && ctx.callee) {
        const args = first.args || [];
        for (const a of args) this.resolveExpr(a, block);
        if (args.length !== res.block.node.params.length)
          this.err(`${res.block.name} erwartet ${res.block.node.params.length} Argument(e), angegeben ${args.length}.`, ref);
      }
      ref.res = res;
      return res;
    }
    prefixSubsOk() {
      return false;
    }
    lookupProcAny(name, block) {
      for (let b = block; b; b = b.parent) if (b.procs.has(name)) return b.procs.get(name);
      return this.root.procs.get(name) || null;
    }
    findLabel(name, block) {
      for (let b = block; b; b = b.parent) {
        if (b.labels.has(name)) return b.labels.get(name);
        if (b.kind === 'proc' && false) break;
      }
      return null;
    }

    resolveExpr(e, block) {
      if (!e) return;
      switch (e.type) {
        case 'num':
          if (!e.val) {
            if (e.bin) e.val = PLI.V.fixed('B', Math.max(1, e.text.length), 0, BigInt('0b' + e.text));
            else {
              const v = PLI.parseNumber(e.text);
              e.val = v || PLI.V.fixed('D', 1, 0, 0n);
              if (e.val.k === 'F' && e.val.p > 31) this.err('Konstante hat mehr als 31 Stellen.', e);
            }
          }
          break;
        case 'str':
          e.val = PLI.V.char(e.v);
          break;
        case 'bitc':
          e.val = PLI.V.bit(e.v);
          break;
        case 'paren':
          this.resolveExpr(e.e, block);
          break;
        case 'un':
          this.resolveExpr(e.e, block);
          break;
        case 'bin':
          this.resolveExpr(e.l, block);
          this.resolveExpr(e.r, block);
          break;
        case 'ref': {
          const r = this.resolveRef(e, block);
          if (r.kind === 'file') this.err(`Die Datei ${e.parts[0].raw} kann nicht als Wert verwendet werden.`, e);
          if (r.kind === 'cond') this.err(`Die Bedingung ${e.parts[0].raw} kann nicht als Wert verwendet werden.`, e);
          break;
        }
        case 'star':
          this.err('"*" ist hier nicht erlaubt.', e);
          break;
      }
    }

    checkDeclExprs(block) {
      const visit = (d) => {
        if (d.dims) for (const dm of d.dims) if (!dm.star) {
          if (dm.lo) this.resolveExpr(dm.lo, block);
          this.resolveExpr(dm.hi, block);
        }
        const a = d.attrs;
        if (a.len && !a.len.star) this.resolveExpr(a.len, block);
        if (a.init) this.resolveInit(a.init, block);
        if (a.basedPtr) this.resolveExpr(a.basedPtr, block);
        if (a.defined) {
          const r = this.resolveRef(a.defined, block);
          if (r.kind !== 'var') this.err('DEFINED muss auf eine Variable verweisen.', d);
          if (a.position) this.resolveExpr(a.position, block);
          if (d.children.length) this.err('DEFINED für Strukturen wird in der Lernumgebung nicht unterstützt.', d);
        }
        if (d.storage === 'STATIC' && d.dims && d.dims.some((dm) => !dm.star && !this.isConstExpr(dm.hi)))
          this.err(`Die Grenzen des STATIC-Arrays ${d.raw} müssen Konstanten sein.`, d);
        for (const c of d.children) visit(c);
      };
      for (const r of block.roots) if (r.kind === 'var') visit(r);
    }
    isConstExpr(e) {
      if (!e) return true;
      if (e.type === 'num') return true;
      if (e.type === 'un') return this.isConstExpr(e.e);
      if (e.type === 'paren') return this.isConstExpr(e.e);
      if (e.type === 'bin') return this.isConstExpr(e.l) && this.isConstExpr(e.r);
      if (e.type === 'ref' && e.res && e.res.kind === 'var' && e.res.root.isConst) return true;
      return false;
    }
    resolveInit(items, block) {
      for (const it of items) {
        if (it.rep && it.rep !== 'star') this.resolveExpr(it.rep, block);
        if (it.value) this.resolveExpr(it.value, block);
        if (it.item) this.resolveInit([it.item], block);
        if (it.list) this.resolveInit(it.list, block);
      }
    }

    // ---------------- Anweisungen ----------------
    checkBlock(block) {
      const node = block.node;
      block.en = enableMask(block.parent ? block.parent.en : PLI.DEFAULT_ENABLED, node && node.prefix);
      this.checkDeclExprs(block);
      if (block.kind === 'proc') {
        if (node.returns) {
          block.retType = this.computeType({ name: node.name, raw: node.name, attrs: node.returns, children: [], kind: 'var', line: node.line, col: node.col });
          if (block.retType.k === 'C' && block.retType.lenExpr && block.retType.lenExpr.star)
            this.err('RETURNS(CHAR(*)) ist nicht erlaubt – gib eine Länge an, z.B. RETURNS(CHAR(100) VARYING).', node);
          if (block.retType.lenExpr && !block.retType.lenExpr.star) this.resolveExpr(block.retType.lenExpr, block);
        } else block.retType = defaultTypeFor(node.name);
        if (node.main && node.params.length) this.warn('Das Hauptprogramm bekommt in der Lernumgebung keine Parameter.', node);
      }
      this.checkList(node.body, block, [], block.kind === 'proc' ? block : this.procOf(block));
      for (const c of block.children) if (c.kind === 'proc') this.checkBlock(c);
    }
    procOf(block) {
      let b = block;
      while (b && b.kind !== 'proc') b = b.parent;
      return b;
    }
    checkList(list, block, loops, proc) {
      for (const st of list) if (st) this.checkStmt(st, block, loops, proc);
    }
    checkStmt(st, block, loops, proc) {
      st.en = enableMask(block.en, st.prefix);
      switch (st.type) {
        case 'null':
        case 'dcl':
        case 'proc':
          break;
        case 'assign':
          for (const t of st.targets) {
            const r = this.resolveRef(t, block, { target: true });
            if (r.kind === 'proc') this.err(`${t.parts[0].raw} ist eine Prozedur. Funktionswerte gibt man mit RETURN(wert); zurück.`, t);
            else if (r.kind === 'builtin' && !(r.def && r.def.pseudo))
              this.err(`Einer eingebauten Funktion kann nichts zugewiesen werden.`, t);
          }
          this.resolveExpr(st.expr, block);
          break;
        case 'if':
          this.resolveExpr(st.cond, block);
          this.checkStmt(st.then, block, loops, proc);
          if (st.els) this.checkStmt(st.els, block, loops, proc);
          break;
        case 'do':
          if (st.while) this.resolveExpr(st.while, block);
          if (st.until) this.resolveExpr(st.until, block);
          if (st.kind === 'iter') {
            const r = this.resolveRef(st.ctrl, block, { target: true });
            if (r.kind !== 'var') this.err('Die Laufvariable muss eine Variable sein.', st.ctrl);
            for (const sp of st.specs) {
              this.resolveExpr(sp.start, block);
              this.resolveExpr(sp.to, block);
              this.resolveExpr(sp.by, block);
              this.resolveExpr(sp.repeat, block);
              this.resolveExpr(sp.while, block);
              this.resolveExpr(sp.until, block);
            }
          }
          this.checkList(st.body, block, loops.concat([st]), proc);
          break;
        case 'select':
          if (st.sel) this.resolveExpr(st.sel, block);
          for (const w of st.whens) {
            for (const e of w.exprs) this.resolveExpr(e, block);
            this.checkStmt(w.unit, block, loops, proc);
          }
          if (st.other) this.checkStmt(st.other, block, loops, proc);
          break;
        case 'call': {
          const r = this.resolveRef(st.ref, block, { callee: true });
          if (r.kind === 'var') this.err(`${st.ref.parts[0].raw} ist eine Variable, keine Prozedur.`, st.ref);
          if (r.kind === 'builtin') this.err(`Eingebaute Funktionen ruft man nicht mit CALL auf – verwende sie in einem Ausdruck.`, st.ref);
          if (r.kind === 'proc' && r.block.node.returns)
            this.info(`${r.block.name} hat RETURNS – der Rückgabewert wird bei CALL verworfen.`, st);
          break;
        }
        case 'return':
          st.proc = proc;
          if (st.expr) {
            this.resolveExpr(st.expr, block);
            if (proc && proc.node.main && !proc.node.returns) this.err('Das Hauptprogramm kann keinen Wert zurückgeben – schreibe nur RETURN;', st);
            else if (proc && !proc.node.returns)
              this.warn(`RETURN mit Wert, aber ${proc.name} hat kein RETURNS(...). Ergänze z.B. RETURNS(FIXED BIN(31)) in der PROCEDURE-Anweisung.`, st);
          } else if (proc && proc.node.returns && block === proc) {
            // RETURN ohne Wert in Funktion
            this.err(`${proc.name} ist eine Funktion (RETURNS) – RETURN braucht einen Wert: RETURN(x);`, st);
          }
          break;
        case 'goto': {
          const l = this.findLabel(st.label, block);
          if (!l) this.err(`Sprungziel ${st.label} nicht gefunden.`, st);
          else st.target = l;
          break;
        }
        case 'leave':
        case 'iterate': {
          let target = null;
          if (st.target) {
            target = [...loops].reverse().find((d) => d.labels && d.labels.includes(st.target));
            if (!target) this.err(`${st.type.toUpperCase()} ${st.target}: kein umschließendes DO mit diesem Label.`, st);
          } else {
            target = loops[loops.length - 1];
            if (!target) this.err(`${st.type.toUpperCase()} steht nicht innerhalb einer DO-Gruppe.`, st);
          }
          st.targetNode = target;
          break;
        }
        case 'stop':
          break;
        case 'put':
        case 'get':
          if (st.file) {
            const r = this.resolveRef(st.file, block, { file: true });
            if (r.kind !== 'file') this.err(`${st.file.parts[0].raw} ist keine Datei.`, st.file);
          }
          if (st.string) {
            if (st.type === 'put') {
              const r = this.resolveRef(st.string, block, { target: true });
              if (r.kind !== 'var') this.err('PUT STRING braucht eine Zeichenketten-Variable.', st.string);
            } else this.resolveExpr(st.string, block);
          }
          if (st.skip) this.resolveExpr(st.skip, block);
          if (st.lineOpt) this.resolveExpr(st.lineOpt, block);
          if (st.items) this.checkDataItems(st.items, block, st.type === 'get');
          if (st.edit)
            for (const pr of st.edit) {
